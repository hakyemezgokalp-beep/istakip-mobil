<body>
<div id="app"><main id="main"><div class="hos" id="acilis"><div class="hos-logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></div><h1>İşTakip</h1><div class="hos-alt">Strateji Geliştirme Başmühendisliği<br><b>KGM</b> 7. Bölge Müdürlüğü</div><div class="acil-y"><i></i></div></div></main><nav class="tabs" id="tabs" style="display:none"></nav></div>
<script>
"use strict";
let D = null, ISLER = [];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const f2 = n => Number(n || 0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fold = s => String(s || "").toLocaleLowerCase("tr-TR").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/i̇/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u");
const p2 = n => String(n).padStart(2,"0");
const tarih = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
const ayYil = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})/); return m ? `${AY[+m[2]-1]} ${m[1]}` : ""; };
const oran = (i, p) => (i > 0 && p !== null && p !== undefined) ? Math.round(p / i * 100) : null;
const oranHtml = (o, tag) => o === null ? "" : `<${tag||"em"}${o < 100 ? ' class="neg"' : ""}>%${o}</${tag||"em"}>`;
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  par:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 10v5M9.5 11.5h4a1.5 1.5 0 0 1 0 3h-4"/></svg>'
};
const TABLAR = [["home","Anasayfa"],["map","Harita"]];
const GERI_AD = { home: "Anasayfa", map: "Harita" };
const byId = id => ISLER.find(j => j.id === id);
const sum = (j, k) => j.cats.reduce((s, c) => s + (c[k] || 0), 0);
const yuzde = (b, h) => h > 0 ? Math.min(100, Math.round(b / h * 100)) : (b > 0 ? 100 : 0);
const pct = j => yuzde(sum(j, "b"), sum(j, "h"));
const std = j => j.cats.map(c => c.ad).join(", ");

// tab: hangi alt sekme seçili; detay: { id, from } (from: geri dönülecek sekme)
let tab = "home", detay = null, isAra = "", parAra = "", secKutu = null;
let mz = { s: 1, x: 0, y: 0 };

function eskiUyari(){
  const gun = Math.floor((Date.now() - D.olusturma) / 86400000);
  return gun >= 7 ? `<div class="warn">⚠️ Bu veriler ${gun} günlük. WhatsApp'taki en son dosyayı yükleyin.</div>` : "";
}
function veriTarih(){
  const d = new Date(D.olusturma);
  return `${d.getDate()} ${AYK[d.getMonth()]} ${d.getFullYear()} · ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

// ---------- Genel Durum (masaüstündeki Standartlar / İl Bazlı Durum) ----------
// "Toplam KM'ye ekleme" seçili işler masaüstündeki gibi bu toplamlara girmez.
const STD_SIRA = ["BY-BSK", "BY-BSK-ON", "BY-SK-BSK", "TY-BSK", "TY-SK", "TY-SK-BSK"];
const IL_SIRA = ["Amasya", "Samsun", "Ordu", "Sinop", "Tokat", "Çorum"];
const IKON_IS = '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#ea580c" stroke-width="1.8"/><rect x="9" y="2.5" width="6" height="3" rx="1" fill="#ea580c"/><line x1="8" y1="10" x2="16" y2="10" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="13.5" x2="16" y2="13.5" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="17" x2="13" y2="17" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/></svg>';
const IKON_HEDEF = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="1" fill="#16a34a"/></svg>';
const yerel = (k, v) => { try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
let gdAcik = true, gdSekme = yerel("istakip-mobil-gd-sekme") || "std", gdSec = null;
const sayilan = () => ISLER.filter(j => !j.ekleme);
const stdSirala = ads => ads.sort((a, b) => (STD_SIRA.indexOf(a) + 1 || 99) - (STD_SIRA.indexOf(b) + 1 || 99) || a.localeCompare(b, "tr"));
function stdToplam(jobs){
  const t = {};
  jobs.forEach(j => j.cats.forEach(c => { const x = t[c.ad] || (t[c.ad] = { h: 0, b: 0 }); x.h += c.h || 0; x.b += c.b || 0; }));
  return t;
}
function cubuk(ad, h, b, extra, attrs){
  const yok = h === 0 && b > 0, p = yuzde(b, h), tag = attrs ? "button" : "div";
  return `<${tag} class="gr${extra || ""}"${attrs || ""}><div class="st"><span>${ad}</span><i>${yok ? "–" : "%" + p}</i></div>
<div class="bar${yok ? " yok" : ""}"><i style="width:${yok ? 100 : p}%"></i></div>
<div class="k">Hedef: ${yok ? "Sene başı hedefi yok" : f2(h) + " KM"} · Biten: ${f2(b)} KM</div></${tag}>`;
}
function isMini(j, ad){
  const c = j.cats.find(x => x.ad === ad);
  return `<button class="gi" data-is="${esc(j.id)}"><div class="st"><b>${esc(j.ad)}</b>${c ? `<i>${c.h === 0 && c.b > 0 ? "–" : "%" + yuzde(c.b, c.h)}</i>` : ""}</div><small>${c ? `Biten ${f2(c.b)} · Hedef ${c.h > 0 ? f2(c.h) : "–"} km · ` : ""}${esc(j.il.join(" · "))}</small></button>`;
}
// ---------- Genel Durum (profesyonel görünüm) ----------
// Standartlar: STANDART · BİTEN · HEDEF · % tablosu + TOPLAM; satıra dokununca
// o standarttaki işler açılır. İl Bazlı: il satırları (iş / fiziksel hedefli
// sayıları), açılınca o ilin standart tablosu. Açılan uzun listeler kendi
// kutusunda kayar.
function tabloSatir(ad, h, b, extra, attrs, ok){
  const yok = h === 0 && b > 0, p = yuzde(b, h), tag = attrs ? "button" : "div";
  return `<${tag} class="tr2${extra || ""}"${attrs || ""}><div class="l"><b>${ok ? `<em>${ok}</em>` : ""}${ad}</b><span class="v">${f2(b)}</span><span>${yok || !h ? "–" : f2(h)}</span><i>${yok ? "–" : p}</i></div><div class="bar${yok ? " yok" : ""}"><i style="width:${yok ? 100 : p}%"></i></div></${tag}>`;
}
function stdTablo(jobs, acilir){
  const t = stdToplam(jobs);
  const adlar = stdSirala(Object.keys(t));
  if(!adlar.length) return '<div class="gbos">Standart verisi yok.</div>';
  let H = 0, B = 0;
  const satirlar = adlar.map(ad => {
    H += t[ad].h; B += t[ad].b;
    if(!acilir) return tabloSatir(esc(ad), t[ad].h, t[ad].b, "", "");
    const acik = gdSec === "s:" + ad;
    return tabloSatir(esc(ad), t[ad].h, t[ad].b, acik ? " acik" : "", ` data-gd="s:${esc(ad)}"`, acik ? "▾" : "▸") +
      (acik ? `<div class="gac">${jobs.filter(j => j.cats.some(c => c.ad === ad)).map(j => isMini(j, ad)).join("") || '<div class="gbos">İş yok.</div>'}</div>` : "");
  }).join("");
  return satirlar + (adlar.length > 1 ? tabloSatir("TOPLAM", H, B, " top2", "") : "");
}
function genelDurum(){
  const jobs = sayilan();
  let govde = "", bas = "";
  if(gdSekme === "std"){
    bas = `<div class="tbh"><span>STANDART</span><span>BİTEN</span><span>HEDEF</span><span>%</span></div>`;
    govde = stdTablo(jobs, true);
  }else{
    bas = `<div class="tbh il"><span>İL</span><span>${IKON_IS}İŞ</span><span>${IKON_HEDEF}FİZ.</span></div>`;
    const iller = IL_SIRA.concat([...new Set(jobs.flatMap(j => j.il))].filter(il => !IL_SIRA.includes(il)).sort((a, b) => a.localeCompare(b, "tr")));
    const satir = (key, ad, liste, ic) => { const acik = gdSec === key;
      return `<button class="tr2 ilr2${acik ? " acik" : ""}" data-gd="${esc(key)}"><div class="l"><b><em>${acik ? "▾" : "▸"}</em>${esc(ad)}</b><span>${liste.length}</span><span>${liste.filter(j => j.fh).length}</span></div></button>${acik ? `<div class="gac">${ic()}</div>` : ""}`; };
    govde = iller.map(il => {
      const ilJobs = jobs.filter(j => j.il.includes(il));
      return satir("i:" + il, il, ilJobs, () => `<div class="tbh" style="padding:4px 0 2px"><span>STANDART</span><span>BİTEN</span><span>HEDEF</span><span>%</span></div>` + stdTablo(ilJobs, false));
    }).join("");
    const cok = jobs.filter(j => j.il.length > 1);
    govde += `<div class="ayrac"></div>` + satir("cok", "Birden Fazla İl", cok, () => cok.map(j => `<button class="gi" data-is="${esc(j.id)}"><b>${esc(j.ad)}</b><small>${esc(j.il.join(" · "))}</small></button>`).join("") || '<div class="gbos">Birden fazla ilde iş yok.</div>');
  }
  const d = new Date(D.olusturma);
  const IA = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
  const HA = '<svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="#fb923c"/></svg>';
  return `<div class="gd" id="gd"><div class="gdh3"><div class="t"><b>GENEL DURUM</b><span>${D.yil}</span></div><div class="d">Veri: ${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}</div>
<div class="n"><div>${IA}<p style="margin:0"><b>${ISLER.length}</b><small>Toplam İş</small></p></div><div>${HA}<p style="margin:0"><b>${ISLER.filter(j => j.fh).length}</b><small>Fiziksel Hedefli</small></p></div></div></div>
<div class="gsek"><button data-gdsekme="std"${gdSekme === "std" ? ' class="on"' : ""}>Standartlar</button><button data-gdsekme="il"${gdSekme === "il" ? ' class="on"' : ""}>İl Bazlı</button></div>${bas}<div class="gdg" id="gdg">${govde}</div></div>`;
}

// ---------- Bu Hafta Girilen KM'ler ----------
// Verinin oluşturulduğu haftada (Pazartesi–Pazar) programa girilen KM aralıkları
function haftaPenceresi(){
  const n = new Date(D.olusturma);
  const pt = new Date(n); pt.setDate(n.getDate() - ((n.getDay() + 6) % 7)); pt.setHours(0, 0, 0, 0);
  const pz = new Date(pt); pz.setDate(pt.getDate() + 6); pz.setHours(23, 59, 59, 999);
  return { a: pt.getTime(), b: pz.getTime(), pt, pz };
}
const kmSayi = v => { const s = String(v ?? "").trim(); const m = s.match(/^(-?\d+)\s*\+\s*(\d+)$/); if(m) return +m[1] + +m[2] / 1000; const x = parseFloat(s.replace(",", ".")); return Number.isFinite(x) ? x : null; };
function haftaGirisleri(){
  const w = haftaPenceresi(), out = [];
  ISLER.forEach(j => { if(j.ekleme) return; (j.kmler || []).forEach(k => {
    if(!k.g || k.g < w.a || k.g > w.b) return;
    const s = kmSayi(k.a), e = kmSayi(k.e); if(s === null || e === null) return;
    out.push({ j, k, km: Math.abs(e - s) / (k.y ? 2 : 1) });
  }); });
  return out.sort((x, y) => y.k.g - x.k.g);
}
function buHafta(){
  const w = haftaPenceresi(), l = haftaGirisleri();
  const gun = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}`;
  return `<div class="bh"><h5>Bu Hafta Girilen KM'ler <em>${gun(w.pt)} – ${gun(w.pz)} · ${l.length} giriş</em></h5><div class="bhl">${l.length ? l.map(x => {
    const d = new Date(x.k.g);
    return `<button class="bi" data-is="${esc(x.j.id)}"><span class="a"><b>${esc(x.j.ad)}</b><span>${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} · ${esc(x.k.s)} · ${esc(x.k.a)} – ${esc(x.k.e)}${x.k.y ? " · yarısı" : ""}</span></span><span class="k">+${f2(x.km)} km<span>${D.yil}: ${f2(sum(x.j, "b"))}</span></span></button>`;
  }).join("") : '<div class="bos">Bu hafta henüz KM girilmedi.</div>'}</div></div>`;
}
function gdYenile(korunsun){ const g = document.getElementById("gd"); if(!g) return; const y = korunsun ? (document.getElementById("gdg")?.scrollTop || 0) : 0; g.outerHTML = genelDurum(); const n = document.getElementById("gdg"); if(n) n.scrollTop = y; }

// ---------- Anasayfa ----------
// Her standart için ayrı satır: "Biten X km · Hedef Y km" + kırmızı/mavi çizgi.
// Hedefi olmayan (biten > 0) standartta çizgi dolu, yüzde yerine "Sene başı
// hedefi yok" yazar; anim: önce yeşil yanar, sonra kırmızıya döner.
function stdSatirlari(j, anim){
  return j.cats.map(c => {
    const yok = c.h === 0 && c.b > 0, p = yuzde(c.b, c.h);
    return `<div class="sr"><div class="st"><span><b>${esc(c.ad)}</b></span>${yok ? '<span class="hy">Sene başı hedefi yok</span>' : `<i>%${p}</i>`}</div>
<div class="bh2"><span><em>Biten</em>${f2(c.b)} km</span><span><em>Hedef</em>${c.h > 0 ? f2(c.h) + " km" : "–"}</span></div>
<div class="bar${yok ? " yok" + (anim ? " anim" : "") : ""}"><i style="width:${yok ? 100 : p}%"></i></div></div>`;
  }).join("");
}
// Favoriler yalnızca bu telefonda saklanır; yeni veri yüklense de kalır
let FAV = (() => { try{ return JSON.parse(yerel("istakip-mobil-fav") || "[]"); }catch(e){ return []; } })();
const favMi = id => FAV.includes(id);
function favDegis(id){ FAV = favMi(id) ? FAV.filter(x => x !== id) : FAV.concat(id); yerel("istakip-mobil-fav", JSON.stringify(FAV)); }
function isSatir(j){
  return `<div class="jr" data-is="${esc(j.id)}"><button class="fav${favMi(j.id) ? " on" : ""}" data-fav="${esc(j.id)}" aria-label="Favori">${favMi(j.id) ? "★" : "☆"}</button><div class="t"><b>${esc(j.ad)}</b></div>
<div class="m">${esc([j.il.join(" · "), j.firma].filter(Boolean).join(" · "))}</div>${stdSatirlari(j)}</div>`;
}
let aramaAcik = false, kmAcik = false, durumAcik = false;
function aramaSonuc(){
  const q = fold(isAra);
  return ISLER.filter(j => !q || fold([j.ad, j.firma, j.sef, j.il.join(" ")].join(" ")).includes(q));
}
function isListesi(list){

function harita(){

function mapUygula(){
  const inn = document.getElementById("mapin"), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!inn || !w || !img) return;
  const W = w.clientWidth, H = w.clientHeight;
  inn.style.width = W + "px";
  const iw = W * mz.s, ih = img.offsetHeight * mz.s;
  mz.x = Math.min(0, Math.max(W - iw, mz.x));
  mz.y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, mz.y));
  inn.style.transform = `translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const bw = (2 / mz.s) + "px";
  inn.querySelectorAll(".kutu").forEach(k => { k.style.borderWidth = bw; });
}
function mapZoom(f, cx, cy){
  const w = document.getElementById("mapwrap"); if(!w) return;
  const ns = Math.min(10, Math.max(1, mz.s * f));
  cx = cx ?? w.clientWidth / 2; cy = cy ?? w.clientHeight / 2;
  mz.x = cx - (cx - mz.x) * ns / mz.s; mz.y = cy - (cy - mz.y) * ns / mz.s; mz.s = ns;
  mapUygula();
}
function resimHazir(f){
  const img = document.getElementById("mapimg"); if(!img) return;
  if(img.complete && img.naturalWidth) f(); else img.addEventListener("load", f, { once: true });
}
function mapKur(){
  const w = document.getElementById("mapwrap"); if(!w) return;
  resimHazir(mapUygula);
  let t0 = null, d0 = 0, s0 = 1, m0 = null, last = 0;
  w.addEventListener("touchstart", e => {
    if(e.target.closest(".sheet, .zoom")) return;
    if(e.touches.length === 2){ const [a, b] = e.touches; d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); s0 = mz.s; m0 = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; t0 = null; }
    else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y };
      const now = Date.now(); if(now - last < 300){ const r = w.getBoundingClientRect(); mapZoom(2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } last = now; }
  }, { passive: true });
  w.addEventListener("touchmove", e => {
    if(e.target.closest(".sheet")) return;
    e.preventDefault();
    const r = w.getBoundingClientRect();
    if(e.touches.length === 2 && d0){ const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); mapZoom((s0 * d / d0) / mz.s, m0.x - r.left, m0.y - r.top); }
    else if(e.touches.length === 1 && t0){ mz.x = e.touches[0].clientX - t0.x; mz.y = e.touches[0].clientY - t0.y; mapUygula(); }
  }, { passive: false });
  w.addEventListener("touchend", e => { if(e.touches.length === 0){ d0 = 0; t0 = null; } else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y }; d0 = 0; } });
  // fare (bilgisayarda açılırsa)
  let md = null, surukle = false;
  w.addEventListener("mousedown", e => { if(e.target.closest(".sheet, .zoom")) return; md = { x: e.clientX - mz.x, y: e.clientY - mz.y, ox: e.clientX, oy: e.clientY }; surukle = false; });
  window.onmousemove = e => { if(md){ if(Math.abs(e.clientX - md.ox) + Math.abs(e.clientY - md.oy) > 4) surukle = true; mz.x = e.clientX - md.x; mz.y = e.clientY - md.y; mapUygula(); } };
  window.onmouseup = () => { md = null; setTimeout(() => { surukle = false; }, 0); };
  w.addEventListener("click", e => { if(surukle){ e.stopPropagation(); e.preventDefault(); } }, true);
  w.addEventListener("wheel", e => { e.preventDefault(); const r = w.getBoundingClientRect(); mapZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}
function kutuyaGit(id){
  const j = byId(id), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!j || !j.kutular.length || !w) return;
  resimHazir(() => {
    const k = j.kutular[0], W = w.clientWidth, H = w.clientHeight, ih = img.offsetHeight;
    // kutu ekranın yaklaşık üçte birini kaplasın
    mz.s = Math.min(10, Math.max(1.5, Math.min(W * 0.35 / (k[2] / 100 * W), H * 0.3 / (k[3] / 100 * ih))));
    const cx = (k[0] + k[2] / 2) / 100 * W, cy = (k[1] + k[3] / 2) / 100 * ih;
    mz.x = W / 2 - cx * mz.s; mz.y = H * 0.38 - cy * mz.s;
    mapUygula();
  });
}

// ----- Katmanlar penceresi -----
function katmanPenceresi(){
  altSayfa('<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f2440" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>', "Katmanlar", "Açmak istediklerinizi seçin", "", "katbb");

const ZAMAN = { "1": ["Son 1 ay", 31], "3": ["Son 3 ay", 92], "t": ["Tümü", 0] };

<div class="lb">ZAMAN</div><div class="seg2 uc">${Object.keys(ZAMAN).map(k => `<button data-katzaman="${k}"${kat.zaman === k ? ' class="on"' : ""}>${ZAMAN[k][0]}</button>`).join("")}</div>
<div class="inf">🛸 ${kat.alan === "is" ? "Bu işin çevresinde (1 km)" : "Tüm bölgede"} ${kat.zaman === "t" ? "" : ZAMAN[kat.zaman][0].toLocaleLowerCase("tr-TR") + "da "}${n} uçuş</div></div>` : ""}</div>`;

// Katmanın simge rengi: beyaz olmayan ilk çizgi (yoksa nokta) rengi
function kmzRenk(k){
  const beyaz = c => { const m = /^#?([0-9a-f]{6})$/i.exec(String(c || "").trim()); let r, g, b; if(m){ const n = parseInt(m[1], 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255; } else { const x = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || ""); if(!x) return false; r = +x[1]; g = +x[2]; b = +x[3]; } return 0.299 * r + 0.587 * g + 0.114 * b > 190; };
  const c = k.cizgi.find(x => !beyaz(x.r)) || k.cizgi[0];
  return (c && c.r) || (k.nok[0] && k.nok[0][3]) || "#64748b";
}
const tarihKisa = t => { const d = new Date(t); return `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}`; };
function katmanOzet(){
  if(!kat) return;
  const K = D.katman || {};
  const say = kat.kmz.size + (kat.drone ? 1 : 0);
  const s = document.getElementById("katsay"); if(s) s.textContent = say;
  const c = document.getElementById("chips");
  if(c) c.innerHTML = (K.kmz || []).filter(k => kat.kmz.has(k.id)).map(k => `<span><i style="background:${esc(kmzRenk(k))}"></i>${esc(k.ad)}</span>`).join("") + (kat.drone ? "<span>🛸 Drone uçuşları</span>" : "");
}
function kmzKatman(id, ac){
  const m = hatHarita; if(!m || !kat) return;
  if(!ac){ if(kat.gruplar[id]){ m.removeLayer(kat.gruplar[id]); delete kat.gruplar[id]; } kat.kmz.delete(id); return; }
  const k = (D.katman.kmz || []).find(x => x.id === id); if(!k) return;
  const g = L.layerGroup();
  k.cizgi.forEach(c => L.polyline(c.p, { color: c.r, weight: 3, opacity: .95, pane: "genel", renderer: kat.rGenel }).addTo(g));
  k.nok.forEach(n => { const mk = L.circleMarker([n[0], n[1]], { radius: 5, color: "#fff", weight: 1.5, fillColor: n[3] || "#f59e0b", fillOpacity: 1, pane: "genel", renderer: kat.rGenel }).addTo(g); if(n[2]) mk.bindTooltip(n[2], { direction: "top", offset: [0, -6] }); });
  g.addTo(m); kat.gruplar[id] = g; kat.kmz.add(id);
}

// ----- Drone uçuşları -----
// Süzme: zaman (son 1 / 3 ay / tümü) ve alan (işin hattına 1 km / tüm bölge).
// Aynı güzergâhta farklı zamanlarda yapılan uçuşlardan yalnız en yenisi
// gösterilir: eski uçuşun rotasının ~%70'i daha yeni bir rotaya 50 m'den
// yakınsa aynı güzergâh sayılır. Rotası olmayan uçuşlarda başlangıç noktası
// 60 m içindeyse aynı yer sayılır.
function hatKutusu(j){
  if(j._kutu) return j._kutu;
  let a0 = 90, a1 = -90, o0 = 180, o1 = -180;
  anaCizgiler(j).forEach(c => c.p.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }));
  const da = 0.0095, doo = 0.0095 / Math.max(0.3, Math.cos((a0 + a1) / 2 * Math.PI / 180));
  return (j._kutu = [a0 - da, a1 + da, o0 - doo, o1 + doo]);
}
function rotaOrtak(r, s){
  // r'nin örnek noktalarından kaçı s'ye 50 m'den yakın (oran)
  const lat = r[0][0], k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = p => [(p[1] - r[0][1]) * k * M, (p[0] - lat) * M];
  const S = s.map(xy), R = r.map(xy);
  // rota boyunca eşit aralıklı örnek noktalar (yalnız köşeler değil)
  let boy = 0; for(let i = 1; i < R.length; i++) boy += Math.hypot(R[i][0] - R[i - 1][0], R[i][1] - R[i - 1][1]);
  const ara = Math.max(15, boy / 60), ornek = [R[0]];
  for(let i = 1; i < R.length; i++){ const A = R[i - 1], B = R[i], d = Math.hypot(B[0] - A[0], B[1] - A[1]); for(let t = ara; t < d; t += ara) ornek.push([A[0] + (B[0] - A[0]) * t / d, A[1] + (B[1] - A[1]) * t / d]); ornek.push(B); }
  let n = 0, ok = 0;
  for(const P of ornek){
    n++;
    let en = Infinity;
    for(let q = 1; q < S.length && en > 50; q++){
      const A = S[q - 1], B = S[q], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
      let t = L2 ? ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
      en = Math.min(en, Math.hypot(P[0] - A[0] - t * dx, P[1] - A[1] - t * dy));
    }
    if(en <= 50) ok++;
  }
  return n ? ok / n : 0;
}
const rotaKutu = r => { let a0 = 90, a1 = -90, o0 = 180, o1 = -180; r.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }); return [a0, a1, o0, o1]; };
const kesisir = (x, y) => !(x[1] < y[0] - 0.0006 || y[1] < x[0] - 0.0006 || x[3] < y[2] - 0.0008 || y[3] < x[2] - 0.0008);
function droneSuz(){
  const dr = D.katman && D.katman.drone; if(!dr || !kat) return [];
  const anahtar = kat.alan + "|" + kat.zaman;
  if(kat.suzOnbellek && kat.suzOnbellek.k === anahtar) return kat.suzOnbellek.l;
  const gun = ZAMAN[kat.zaman][1], sinirT = gun ? Date.now() - gun * 86400000 : 0;
  let l = dr.ucus.filter(u => !sinirT || (u.t && u.t >= sinirT));
  if(kat.alan === "is" && hatIs){
    const kt = hatKutusu(hatIs);
    kat.mesafe = kat.mesafe || new Map();
    l = l.filter(u => {
      if(u.a < kt[0] || u.a > kt[1] || u.o < kt[2] || u.o > kt[3]) return false;   // kaba eleme
      if(!kat.mesafe.has(u)){ const r = kmBul(hatIs, u.a, u.o); kat.mesafe.set(u, r ? r.d : Infinity); }
      return kat.mesafe.get(u) <= 1000;
    });
  }
  l = l.slice().sort((a, b) => (b.t || 0) - (a.t || 0));
  const tut = [];
  l.forEach(u => {
    if(u.r && u.r.length > 1 && !u._kutu) u._kutu = rotaKutu(u.r);
    const ayni = tut.some(x => {
      if(haversine([x.a, x.o], [u.a, u.o]) < 60) return true;
      return u.r && x.r && u.r.length > 1 && x.r.length > 1 && kesisir(u._kutu, x._kutu) && rotaOrtak(u.r, x.r) >= 0.7;
    });
    if(!ayni) tut.push(u);
  });
  kat.suzOnbellek = { k: anahtar, l: tut };
  return tut;
}
function yasRenk(t){
  const g = t ? (Date.now() - t) / 86400000 : 9999;
  return g <= 31 ? "#1d4ed8" : g <= 92 ? "#3b82f6" : g <= 183 ? "#60a5fa" : g <= 365 ? "#93c5fd" : "#cbd5e1";
}
function dronePop(u){
  const d = u.t ? new Date(u.t) : null;
  return `<div class="dpop"><b>🛸 Drone uçuşu</b><div>Tarih <em>${d ? `${tarihKisa(u.t)} ${p2(d.getHours())}:${p2(d.getMinutes())}` : "–"}</em></div><div>Süre <em>${u.s ? Math.max(1, Math.round(u.s / 60)) + " dk" : "–"}</em></div><div>Mesafe <em>${u.m ? (u.m >= 1000 ? (u.m / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + " km" : u.m + " m") : "–"}</em></div><div>Klasör <em>${esc(u.k || "–")}</em></div></div>`;
}
function seritCiz(){
  const m = hatHarita; if(!m || !kat) return;
  if(kat.seritGrup){ m.removeLayer(kat.seritGrup); kat.seritGrup = null; }
  if(!kat.drone || kat.alan !== "is" || !hatIs) return;
  const lat = m.getCenter().lat, mpp = 40075016.686 * Math.cos(lat * Math.PI / 180) / Math.pow(2, m.getZoom() + 8);
  const w = Math.min(3000, 2000 / mpp);
  const g = L.layerGroup();
  anaCizgiler(hatIs).forEach(c => L.polyline(c.p, { color: "#ffffff", weight: w, opacity: .13, lineCap: "round", lineJoin: "round", pane: "serit", renderer: kat.rSerit, interactive: false }).addTo(g));
  g.addTo(m); kat.seritGrup = g;
}
function droneNoktalar(){
  const m = hatHarita; if(!m || !kat) return;
  if(kat.droneGrup){ m.removeLayer(kat.droneGrup); kat.droneGrup = null; }
  const serit = document.getElementById("dserit");
  if(!kat.drone){ if(serit) serit.style.display = "none"; return; }
  const l = droneSuz();
  const g = L.layerGroup();
  // rotalar (masaüstünde çözülmüş olanlar)
  // rotalar ince çizilir ve yumuşak yanıp söner; alttaki iş hattı görünür kalır
  l.forEach(u => { if(u.r) L.polyline(u.r, { color: yasRenk(u.t), weight: 2.5, opacity: 1, pane: "drone", renderer: kat.rDrone, interactive: false, className: "dyan" }).addTo(g); });
  // uzaklaştırınca yakın noktalar tek yuvarlakta toplanır
  const z = m.getZoom(), kume = [];
  l.forEach(u => {
    const p = m.latLngToLayerPoint([u.a, u.o]);
    const k = z < 15 ? kume.find(x => Math.hypot(x.p.x - p.x, x.p.y - p.y) < 38) : null;
    if(k) k.u.push(u); else kume.push({ p, u: [u] });
  });
  kume.forEach(k => {
    if(k.u.length === 1){
      const u = k.u[0];
      L.circleMarker([u.a, u.o], { radius: 7, color: "#fff", weight: 2, fillColor: yasRenk(u.t), fillOpacity: 1, pane: "drone", renderer: kat.rDrone, className: "dyan" }).bindPopup(dronePop(u)).addTo(g);
    }else{
      const n = k.u.length, r = Math.min(40, 24 + n);
      const enYeni = k.u.reduce((a, b) => (b.t || 0) > (a.t || 0) ? b : a);
      const lat = k.u.reduce((s, u) => s + u.a, 0) / n, lon = k.u.reduce((s, u) => s + u.o, 0) / n;
      L.marker([lat, lon], { icon: L.divIcon({ className: "", html: `<div class="dkume dyan" style="width:${r}px;height:${r}px;background:${yasRenk(enYeni.t)}">${n}</div>`, iconSize: [r, r] }) })
        .on("click", () => m.fitBounds(k.u.map(u => [u.a, u.o]), { padding: [60, 60], maxZoom: 17 })).addTo(g);
    }
  });
  g.addTo(m); kat.droneGrup = g;
  if(serit){
    serit.style.display = "";
    serit.innerHTML = `<div class="r1"><b>🛸 ${kat.alan === "is" ? "Bu işin çevresinde" : "Tüm bölgede"} ${l.length} uçuş</b><button data-katzamandon>${ZAMAN[kat.zaman][0]} ▾</button></div><div class="lg">Yeni<i></i>Eski</div>`;
  }
}
function droneYenile(){ if(kat) kat.suzOnbellek = null; seritCiz(); droneNoktalar(); katmanOzet(); }
document.addEventListener("click", e => {
  if(!kat || !hatHarita) return;
  if(e.target.closest("[data-katlar]")){ katmanPenceresi(); return; }
  const km = e.target.closest("[data-katkmz]"); if(km){ kmzKatman(km.dataset.katkmz, !kat.kmz.has(km.dataset.katkmz)); katmanOzet(); katmanCiz(); return; }
  if(e.target.closest("[data-kattum]")){ const K = D.katman.kmz || [], hepsi = K.every(k => kat.kmz.has(k.id)); K.forEach(k => kmzKatman(k.id, !hepsi)); katmanOzet(); katmanCiz(); return; }
  if(e.target.closest("[data-katdrone]")){ kat.drone = !kat.drone; droneYenile(); katmanCiz(); return; }
  const al = e.target.closest("[data-katalan]"); if(al){ kat.alan = al.dataset.katalan; droneYenile(); katmanCiz(); return; }
  const zm = e.target.closest("[data-katzaman]"); if(zm){ kat.zaman = zm.dataset.katzaman; droneYenile(); katmanCiz(); return; }
  if(e.target.closest("[data-katzamandon]")){ const s = Object.keys(ZAMAN); kat.zaman = s[(s.indexOf(kat.zaman) + 1) % s.length]; droneYenile(); return; }
});

// ---------- Yol Tarifi ----------
// İşin KMZ hattından başlangıç / bitiş ve size en yakın nokta bulunur; seçilen
// nokta Apple Haritalar ya da Google Haritalar'da yol tarifiyle açılır.
// Konum yalnızca bu ekranda kullanılır, hiçbir yere gönderilmez.
const ytBtn = j => j.hat ? `<button class="btn yt" data-yt="${esc(j.id)}">🧭 Yol Tarifi</button>` : `<button class="btn yt bos" data-kmzyok>🧭 Yol Tarifi</button>`;
const PIN = c => `<svg viewBox="0 0 24 24"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z" fill="${c}"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>`;
function haversine(a, b){
  const R = 6371000, r = Math.PI / 180, dA = (b[0] - a[0]) * r, dO = (b[1] - a[1]) * r;
  const x = Math.sin(dA / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dO / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
const anaCizgiler = j => { const r = j.hat.cizgi.filter(c => !c.i); return r.length ? r : j.hat.cizgi; };
// Başlangıç / bitiş: adında KM yazan noktalardan en küçük ve en büyük KM;
// yoksa en uzun çizginin iki ucu
function uclar(j){
  const kms = [];
  j.hat.nok.forEach(n => { const x = /(\d+)\s*\+\s*(\d{3})/.exec(n[2] || ""); if(x) kms.push({ km: +x[1] + +x[2] / 1000, p: [n[0], n[1]] }); });
  if(kms.length >= 2){

  const sk = e.target.closest("[data-itisek]");
  if(sk){ itiDurum.i = Number(sk.dataset.itisek); document.querySelectorAll("[data-itisek]").forEach(b => b.classList.toggle("on", b === sk)); itiCiz(); return; }

});

// Bu iş ya da birden fazla iş; İş Bilgileri / Parasal / İtinerer
// bölümlerinden istenenler. PDF telefonda üretilir (internete gönderilmez),
// sonra paylaşım menüsü (WhatsApp, Mail…) açılır. Türkçe harfler için yazı
// tipi PDF'e gömülür.
let pdfDurum = null;
function pdfPenceresi(j){
  pdfDurum = { tek: true, j, sec: new Set([j.id]), bol: { bilgi: true, par: parVar(j), iti: itiVar(j) }, ara: "", blob: null, ad: "" };
  altSayfa("📄", "PDF Gönder", j.ad, "", "pdfbb", "pdfs");
  pdfCiz();
}
function pdfSecili(){ return pdfDurum.tek ? [pdfDurum.j] : ISLER.filter(x => pdfDurum.sec.has(x.id)); }
function pdfCiz(){
  const b = document.getElementById("pdfbb"); if(!b || !pdfDurum) return;
  const d = pdfDurum, sec = pdfSecili();
  const parOk = sec.some(parVar), itiOk = sec.some(itiVar);
  const q = fold(d.ara);
  const liste = ISLER.filter(x => !q || fold([x.ad, x.firma, x.il.join(" ")].join(" ")).includes(q));
  const bol = (k, ad, alt, ok) => `<label class="${ok ? "" : "yok"}"><input type="checkbox" data-pdfbol="${k}"${d.bol[k] && ok ? " checked" : ""}${ok ? "" : " disabled"}><span>${ad}<small>${alt}</small></span></label>`;
  b.innerHTML = `<div class="seg2"><button data-pdftek="1"${d.tek ? ' class="on"' : ""}>Bu iş</button><button data-pdftek="0"${d.tek ? "" : ' class="on"'}>Birden fazla iş</button></div>
${d.tek ? "" : `<div class="pdfara"><input id="pdfara" type="search" placeholder="İş ara…" value="${esc(d.ara)}" autocomplete="off"><button data-pdftum>${liste.every(x => d.sec.has(x.id)) && liste.length ? "Seçimi kaldır" : "Tümünü seç"}</button></div>
<div class="pdfis" id="pdfis">${liste.map(x => `<label><input type="checkbox" data-pdfis="${esc(x.id)}"${d.sec.has(x.id) ? " checked" : ""}><span>${esc(x.ad)}</span></label>`).join("") || '<div class="muted" style="padding:10px">İş bulunamadı.</div>'}</div>
<div class="muted" style="margin:6px 2px 12px">${d.sec.size} iş seçili</div>`}
<div class="bgrp" style="margin-top:${d.tek ? 4 : 0}px">BÖLÜMLER</div>
<div class="pdfbol">${bol("bilgi", "İş Bilgileri", "İhale uzunluğu, yapılan ve kalan km'ler", true)}${bol("par", "Parasal", parOk ? "İhale / Proje Bedeli ve Excel bilgileri" : "Seçili işlerde parasal bilgi yok", parOk)}${bol("iti", "İtinerer", itiOk ? "Her itinerer ayrı yatay sayfada" : "Seçili işlerde itinerer yok", itiOk)}</div>
${d.blob ? `<button class="go" data-pdfpaylas>📤 Paylaş / Gönder</button><div class="ytalt"><span>${esc(d.ad)}</span><button data-pdfonizle>Önizle</button></div>` : `<button class="go" data-pdfyap>📄 PDF Oluştur</button>`}
<div class="pdfdur" id="pdfdur"></div>`;
}
document.addEventListener("click", e => {

  const d = pdfDurum;
  const t = e.target.closest("[data-pdftek]"); if(t){ d.tek = t.dataset.pdftek === "1"; d.blob = null; pdfCiz(); return; }

const pdfDurumYaz = m => { const x = document.getElementById("pdfdur"); if(x) x.textContent = m; };

// jsPDF ve yazı tipleri ilk kullanımda yüklenir (çevrimdışı önbellekte durur)
let pdfKutuphane = null;
function pdfHazirla(){
  if(pdfKutuphane) return pdfKutuphane;
  pdfKutuphane = (async () => {
    if(!window.jspdf) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "jspdf.min.js"; s.onload = ok; s.onerror = () => no(new Error("PDF bileşeni yüklenemedi")); document.head.appendChild(s); });
    const b64 = async u => { const r = await fetch(u); if(!r.ok) throw new Error("Yazı tipi yüklenemedi"); const a = new Uint8Array(await r.arrayBuffer()); let s = ""; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
    return { normal: await b64("DejaVuSans-tr.ttf"), kalin: await b64("DejaVuSans-Bold-tr.ttf") };
  })();
  pdfKutuphane.catch(() => { pdfKutuphane = null; });
  return pdfKutuphane;
}

// Yol Takip çizimini resme çevir: stiller öğelere işlenir, SVG → canvas → JPEG
async function itiResimleri(kod){
  const pr = D.iti.projeler[kod]; if(!pr) return [];
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-10000px;top:0;width:4000px;background:#fff";
  document.body.appendChild(host);
  host.attachShadow({ mode: "open" }).innerHTML = `<style>${itiCss()}</style><div class="kap">${pr.html}</div>`;
  const ozellik = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "font-size", "font-family", "font-weight", "font-style", "text-anchor", "dominant-baseline", "visibility", "display", "letter-spacing"];
  const svgs = [...host.shadowRoot.querySelectorAll("svg")].filter(x => !x.parentElement.closest("svg") && x.viewBox && x.viewBox.baseVal && x.viewBox.baseVal.width);
  const out = [];
  for(const s of svgs){
    const vb = s.viewBox.baseVal;
    s.style.width = vb.width + "px"; s.style.height = vb.height + "px";
    const kopya = s.cloneNode(true);
    const kaynak = [s, ...s.querySelectorAll("*")], hedef = [kopya, ...kopya.querySelectorAll("*")];
    kaynak.forEach((el, i) => { const cs = getComputedStyle(el); hedef[i].setAttribute("style", ozellik.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
    kopya.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    kopya.setAttribute("width", vb.width); kopya.setAttribute("height", vb.height);
    const metin = new XMLSerializer().serializeToString(kopya);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("İtinerer çizimi resme çevrilemedi")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(metin); });
    const k = Math.min(3, 3600 / vb.width, 2400 / vb.height);
    const c = document.createElement("canvas"); c.width = Math.round(vb.width * k); c.height = Math.round(vb.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out.push({ veri: c.toDataURL("image/jpeg", 0.9), w: c.width, h: c.height });
  }
  host.remove();
  return out;
}

const dosyaGuvenli = s => String(s).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 120);
async function pdfYap(){
  const d = pdfDurum, isler = pdfSecili();
  const bol = { bilgi: d.bol.bilgi, par: d.bol.par && isler.some(parVar), iti: d.bol.iti && isler.some(itiVar) };
  if(!isler.length){ pdfDurumYaz("En az bir iş seçin."); return; }
  if(!bol.bilgi && !bol.par && !bol.iti){ pdfDurumYaz("En az bir bölüm seçin."); return; }
  const btn = document.querySelector("[data-pdfyap]"); if(btn){ btn.disabled = true; btn.textContent = "Hazırlanıyor…"; }
  try{
    await agirHazir();
    pdfDurumYaz("PDF bileşeni yükleniyor…");
    const font = await pdfHazirla();
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    doc.addFileToVFS("dv.ttf", font.normal); doc.addFont("dv.ttf", "DV", "normal");
    doc.addFileToVFS("dvb.ttf", font.kalin); doc.addFont("dvb.ttf", "DV", "bold");
    doc.setFont("DV", "normal");
    doc._bos = true;
    for(let n = 0; n < isler.length; n++){
      pdfDurumYaz(`Hazırlanıyor… ${n + 1} / ${isler.length}`);
      await pdfIs(doc, isler[n], bol);
    }
    pdfCerceve(doc);
    const t = new Date(), tarihS = `${p2(t.getDate())}.${p2(t.getMonth() + 1)}.${t.getFullYear()}`;
    const secBol = Object.keys(bol).filter(k => bol[k]);
    const bolAd = { bilgi: "İş Bilgileri", par: "Parasal", iti: "İtinerer" };
    let ad = isler.length === 1 ? isler[0].ad : `${isler[0].ad} ve ${isler.length - 1} iş daha`;
    if(secBol.length === 1) ad += " - " + bolAd[secBol[0]];
    d.ad = dosyaGuvenli(`${ad} (${tarihS})`) + ".pdf";
    d.blob = doc.output("blob");
    pdfCiz();
    pdfDurumYaz(`PDF hazır (${Math.max(1, Math.round(d.blob.size / 1024))} KB). Göndermek için Paylaş'a dokunun.`);
  }catch(err){
    if(btn){ btn.disabled = false; btn.textContent = "📄 PDF Oluştur"; }
    pdfDurumYaz("PDF oluşturulamadı: " + err.message);
  }
}
async function pdfPaylas(){
  const d = pdfDurum; if(!d || !d.blob) return;
  const f = new File([d.blob], d.ad, { type: "application/pdf" });
  try{
    if(navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f], title: d.ad.replace(/\.pdf$/, "") }); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // paylaşım desteklenmiyorsa indir
  const a = document.createElement("a"); a.href = URL.createObjectURL(d.blob); a.download = d.ad; document.body.appendChild(a); a.click(); a.remove();
  bildir("PDF indirildi");
}

// ----- PDF sayfa düzeni -----
const PDF = { k: 14, ust: 24, alt: 16, turuncu: [234, 88, 12], koyu: [17, 24, 39], gri: [100, 116, 139], cizgi: [226, 232, 240] };
const BUYUK = s => String(s || "").toLocaleUpperCase("tr-TR");
// Her sayfaya üst başlık ve alt bilgi (sayfa numarası)
function pdfCerceve(doc){
  const n = doc.getNumberOfPages(), t = new Date();
  const tarihS = `${p2(t.getDate())}.${p2(t.getMonth() + 1)}.${t.getFullYear()}`;
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setFillColor(...PDF.turuncu); doc.rect(0, 0, W, 2.2, "F");
    doc.setFont("DV", "bold"); doc.setFontSize(10.5); doc.setTextColor(...PDF.koyu);
    doc.text("KARAYOLLARI 7. BÖLGE MÜDÜRLÜĞÜ", PDF.k, 12);
    doc.setFont("DV", "normal"); doc.setFontSize(8.5); doc.setTextColor(...PDF.gri);
    doc.text("Strateji Geliştirme Başmühendisliği", PDF.k, 16.5);
    doc.text(tarihS, W - PDF.k, 12, { align: "right" });
    doc.setDrawColor(...PDF.cizgi); doc.setLineWidth(0.3); doc.line(PDF.k, 19, W - PDF.k, 19);
    doc.line(PDF.k, H - 11, W - PDF.k, H - 11);
    doc.setFontSize(7.5);
    doc.text("İşTakip · Bilgi amaçlıdır", PDF.k, H - 6.5);
    doc.text(`Sayfa ${i} / ${n}`, W - PDF.k, H - 6.5, { align: "right" });
  }
}
function pdfBolumBaslik(doc, y, ad){
  const W = doc.internal.pageSize.getWidth();
  doc.setFont("DV", "bold"); doc.setFontSize(9.5); doc.setTextColor(...PDF.turuncu);
  doc.text(BUYUK(ad), PDF.k, y);
  doc.setDrawColor(253, 186, 116); doc.setLineWidth(0.4); doc.line(PDF.k, y + 1.8, W - PDF.k, y + 1.8);
  return y + 7;
}
// Sayfaya sığmıyorsa yeni dikey sayfa
function pdfYer(doc, y, h){
  const H = doc.internal.pageSize.getHeight();
  if(y + h <= H - PDF.alt) return y;
  doc.addPage("a4", "portrait");
  return PDF.ust;
}
// İşin sabit kutusu (her işte bir kez): iş adı, yüklenici, kontrol şefi, il, tarihler
function pdfKutu(doc, j, y){
  const W = doc.internal.pageSize.getWidth(), gen = W - 2 * PDF.k;
  doc.setFont("DV", "bold"); doc.setFontSize(13);
  const adS = doc.splitTextToSize(j.ad, gen - 10);
  const alanlar = [["Yüklenici", j.firma], ["Kontrol Şefi", j.sef], ["İl", j.il.join(" · ")], ["İhale Tarihi", tarih(j.par.it)], ["Sözleşme Tarihi", tarih(j.par.st)]];
  const satir = Math.ceil(alanlar.length / 2), h = 8 + adS.length * 5.6 + satir * 10 + 2;
  doc.setFillColor(255, 247, 237); doc.setDrawColor(254, 215, 170); doc.setLineWidth(0.4);
  doc.roundedRect(PDF.k, y, gen, h, 2.5, 2.5, "FD");
  doc.setFillColor(...PDF.turuncu); doc.rect(PDF.k, y, 1.4, h, "F");
  doc.setTextColor(...PDF.koyu); doc.text(adS, PDF.k + 5, y + 7.5);
  let yy = y + 8 + adS.length * 5.6;
  alanlar.forEach(([e, v], i) => {
    const x = PDF.k + 5 + (i % 2) * (gen / 2);
    const ry = yy + Math.floor(i / 2) * 10;
    doc.setFont("DV", "normal"); doc.setFontSize(7.5); doc.setTextColor(...PDF.gri); doc.text(e, x, ry);
    doc.setFont("DV", "bold"); doc.setFontSize(9.5); doc.setTextColor(...PDF.koyu);
    doc.text(doc.splitTextToSize(v || "–", gen / 2 - 8)[0], x, ry + 4.4);
  });
  return y + h + 7;
}
function pdfTablo(doc, y, basliklar, satirlar, opt){
  const W = doc.internal.pageSize.getWidth(), gen = W - 2 * PDF.k;
  const ilkG = opt && opt.ilk ? opt.ilk : Math.min(62, gen * 0.4);
  const sw = basliklar.length ? (gen - ilkG) / basliklar.length : 0, sh = 7;
  y = pdfYer(doc, y, sh * (satirlar.length + 1));
  doc.setFillColor(255, 247, 237); doc.rect(PDF.k, y, gen, sh, "F");
  doc.setFont("DV", "bold"); doc.setFontSize(8); doc.setTextColor(154, 52, 18);
  basliklar.forEach((b, i) => doc.text(b, PDF.k + ilkG + sw * (i + 1) - 2, y + 4.8, { align: "right" }));
  y += sh;
  satirlar.forEach(([e, deg, vurgu]) => {
    if(vurgu){ doc.setFillColor(248, 250, 252); doc.rect(PDF.k, y, gen, sh, "F"); }
    doc.setFont("DV", vurgu ? "bold" : "normal"); doc.setFontSize(8.5); doc.setTextColor(...(vurgu ? [154, 52, 18] : PDF.koyu));
    doc.text(e, PDF.k + 2, y + 4.8);
    doc.setFont("DV", "bold");
    deg.forEach((v, i) => doc.text(v, PDF.k + ilkG + sw * (i + 1) - 2, y + 4.8, { align: "right" }));
    doc.setDrawColor(...PDF.cizgi); doc.setLineWidth(0.2); doc.line(PDF.k, y + sh, PDF.k + gen, y + sh);
    y += sh;
  });
  return y + 6;
}
function pdfBilgi(doc, j, y){
  y = pdfYer(doc, y, 30);
  y = pdfBolumBaslik(doc, y, "İş Bilgileri");
  const km = v => v === null || v === undefined ? "–" : f2(v) + " km";
  const uz = j.uz || [];
  if(uz.length){
    const kalan = r => r.u === null || r.u === undefined ? "–" : km(Math.max(0, r.u - (r.o || 0) - (r.y || 0)));
    y = pdfTablo(doc, y, uz.map(r => r.s), [
      ["İhale Uzunluğu", uz.map(r => km(r.u))],
      [`${D.yil} Öncesi Yapılan`, uz.map(r => km(r.o || 0))],
      [`${D.yil} Hedef`, uz.map(r => (r.h || 0) > 0 ? km(r.h) : "–")],
      [`${yilEki(D.yil)} Yapılan`, uz.map(r => km(r.y || 0))],
      [`${D.yil} Kalan`, uz.map(r => (r.h || 0) > 0 ? km(Math.max(0, r.h - (r.y || 0))) : "–"), true],
      ["Toplam Kalan", uz.map(kalan), true]
    ]);
  }else if(j.cats.length){
    y = pdfTablo(doc, y, j.cats.map(c => c.ad), [
      [`${D.yil} Hedef`, j.cats.map(c => c.h > 0 ? km(c.h) : "–")],
      [`${yilEki(D.yil)} Yapılan`, j.cats.map(c => km(c.b))],
      ["Gerçekleşme", j.cats.map(c => c.h > 0 ? "%" + yuzde(c.b, c.h) : "Hedef yok"), true]
    ]);
  }else{
    doc.setFont("DV", "normal"); doc.setFontSize(9); doc.setTextColor(...PDF.gri); doc.text("Bu iş için km bilgisi girilmemiş.", PDF.k, y + 2); y += 10;
  }
  return y;
}
function pdfParasal(doc, j, y){
  const W = doc.internal.pageSize.getWidth(), gen = W - 2 * PDF.k;
  y = pdfYer(doc, y, 34);
  y = pdfBolumBaslik(doc, y, "Parasal");
  const tl = n => n !== null && n !== undefined ? f2(n) + " ₺" : "–";
  const kutular = (ib, pb, ust) => {
    y = pdfYer(doc, y, 18);
    if(ust){ doc.setFont("DV", "bold"); doc.setFontSize(9); doc.setTextColor(194, 65, 12); doc.text(ust, PDF.k, y + 1); y += 4; }
    const w = (gen - 4) / 2;
    [["İhale Bedeli", ib], ["Proje Bedeli", pb]].forEach(([e, v], i) => {
      const x = PDF.k + i * (w + 4);
      doc.setFillColor(240, 250, 243); doc.setDrawColor(205, 235, 215); doc.setLineWidth(0.3); doc.roundedRect(x, y, w, 13, 2, 2, "FD");
      doc.setFont("DV", "normal"); doc.setFontSize(7.5); doc.setTextColor(75, 107, 87); doc.text(e, x + 3.5, y + 4.6);
      doc.setFont("DV", "bold"); doc.setFontSize(11); doc.setTextColor(21, 128, 61); doc.text(tl(v), x + 3.5, y + 10.2);
    });
    y += 17;
  };
  const satirlar = l => l.forEach(([b, v]) => {
    doc.setFont("DV", "normal"); doc.setFontSize(8.5);
    const sol = doc.splitTextToSize(String(b), gen * 0.58);
    doc.setFont("DV", "bold"); doc.setFontSize(9);
    const sag = doc.splitTextToSize(String(v), gen * 0.38);
    const h = Math.max(sol.length, sag.length) * 4.2 + 3;
    y = pdfYer(doc, y, h);
    doc.setFont("DV", "normal"); doc.setFontSize(8.5); doc.setTextColor(...PDF.gri); doc.text(sol, PDF.k + 1, y + 4);
    doc.setFont("DV", "bold"); doc.setFontSize(9); doc.setTextColor(...PDF.koyu); doc.text(sag, W - PDF.k - 1, y + 4, { align: "right" });
    doc.setDrawColor(...PDF.cizgi); doc.setLineWidth(0.2); doc.line(PDF.k, y + h, W - PDF.k, y + h);
    y += h;
  });
  const p = j.par;
  kutular(p.ib, p.pb, p.iller && j.il.length > 1 ? "Toplam" : "");
  if(j.ek && j.ek.length){ satirlar(j.ek); y += 4; }
  if(p.iller && j.il.length > 1) Object.keys(p.iller).forEach(il => { const x = p.iller[il] || {}; kutular(x.ihaleTutari, x.projeBedeli, il); const e = (j.eki && j.eki[il]) || []; if(e.length){ satirlar(e); y += 4; } });
  return y + 2;
}
// İlk (boş) sayfa kullanılır; sonrakiler eklenir
function yeniSayfa(doc, yatay){
  if(doc._bos){
    doc._bos = false;
    if(yatay){ doc.addPage("a4", "landscape"); doc.deletePage(1); }
    return;
  }
  doc.addPage("a4", yatay ? "landscape" : "portrait");
}
async function pdfIs(doc, j, bol){
  const dikey = bol.bilgi || (bol.par && parVar(j));
  let kutuYazildi = false;
  if(dikey){
    yeniSayfa(doc, false);
    let y = pdfKutu(doc, j, PDF.ust);
    kutuYazildi = true;
    if(bol.bilgi) y = pdfBilgi(doc, j, y);
    if(bol.par && parVar(j)) y = pdfParasal(doc, j, y);
  }
  if(bol.iti && itiVar(j)){
    const kodlar = (j.iti || []).filter(k => D.iti.projeler[k]);
    for(const kod of kodlar){
      const resimler = await itiResimleri(kod);
      for(const r of resimler){
        yeniSayfa(doc, true);
        const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
        let yy = PDF.ust;
        if(!kutuYazildi){ yy = pdfKutu(doc, j, yy); kutuYazildi = true; }
        doc.setFont("DV", "bold"); doc.setFontSize(10); doc.setTextColor(...PDF.koyu);
        doc.text(doc.splitTextToSize(`İtinerer · ${D.iti.projeler[kod].ad}`, W - 2 * PDF.k)[0], PDF.k, yy + 1);
        yy += 5;
        const mw = W - 2 * PDF.k, mh = H - PDF.alt - yy - 2;
        const sc = Math.min(mw / r.w, mh / r.h), w = r.w * sc, h = r.h * sc;
        doc.addImage(r.veri, "JPEG", PDF.k + (mw - w) / 2, yy, w, h);
      }
    }
  }
}

// ---------- Veri yükleme / saklama ----------
// Veri yalnızca bu telefonda (IndexedDB) saklanır; hiçbir yere gönderilmez.
const DB_AD = "istakip-mobil", DEPO = "veri";
function idb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(DB_AD, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DEPO);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
// Hızlı açılış için veri iki parça saklanır: "son" (işler, km'ler — açılışta
// okunur) ve "agir" (bölge haritası resmi, itinerer çizimleri, genel KMZ /
// drone katmanları — gerektiğinde okunur).
async function idbOku(anahtar){
  const db = await idb();
  return await new Promise(ok => { const t = db.transaction(DEPO).objectStore(DEPO).get(anahtar); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); });
}
async function veriOku(){
  try{ return await idbOku("son"); }
  catch(e){ try{ return JSON.parse(localStorage.getItem("istakip-mobil-veri") || "null"); }catch(_){ return null; } }
}
function bol(v){
  const agir = { harita: v.harita || "", iti: v.iti || null, katman: v.katman || null };
  const kodlar = v.iti && v.iti.projeler ? Object.keys(v.iti.projeler) : (v.itiKodlar || []);
  const cekirdek = { ...v, harita: null, iti: null, katman: null, itiKodlar: kodlar, haritaVar: !!(v.harita || v.haritaVar), katmanVar: !!(v.katman || v.katmanVar), _parcali: 1 };
  return { cekirdek, agir };
}
async function veriYaz(v){
  const { cekirdek, agir } = bol(v);
  try{
    const db = await idb();
    await new Promise((ok, no) => { const t = db.transaction(DEPO, "readwrite"); const st = t.objectStore(DEPO); st.put(cekirdek, "son"); st.put(agir, "agir"); t.oncomplete = ok; t.onerror = () => no(t.error); });
  }catch(e){ try{ localStorage.setItem("istakip-mobil-veri", JSON.stringify(v)); }catch(_){} }
}
// Ağır parça bir kez okunur; harita, itinerer, katmanlar ve PDF bunu bekler
let agirSoz = null;
function agirHazir(){
  if(!D || D._agirTam) return Promise.resolve();
  if(!agirSoz) agirSoz = idbOku("agir").then(a => {
    if(a){ D.harita = a.harita || ""; D.iti = a.iti || null; D.katman = a.katman || null; }
    D._agirTam = true;
  }).catch(() => { D._agirTam = true; });
  return agirSoz;
}
// Harita bileşeni (Leaflet) yalnız KMZ ekranı açılınca yüklenir
let leafletSoz = null;
function leafletHazir(){
  if(typeof L !== "undefined") return Promise.resolve();
  if(!leafletSoz) leafletSoz = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "leaflet.js"; sc.onload = ok; sc.onerror = () => { leafletSoz = null; no(new Error("Harita bileşeni yüklenemedi")); }; document.head.appendChild(sc); });
  return leafletSoz;
}
// Eski (1. sürüm) dosyalar da açılsın
// Excel başlığı tamamı büyük harfse Türkçe kurala göre ilk harfler büyük;
// ABD biçimli sayılar Türkçe biçime (yalnız eski dosyalarda gerekir)
function baslikGuzel(h){
  const s = String(h || ""), harf = s.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, "");
  if(!harf || harf !== harf.toLocaleUpperCase("tr-TR")) return s;
  return s.split(/(\([^)]*\))/).map(p => p.startsWith("(") ? p : p.toLocaleLowerCase("tr-TR").replace(/(^|[\s\-/.])([a-zçğıöşü])/g, (m, a, b) => a + b.toLocaleUpperCase("tr-TR"))).join("");
}
function trSayi(v){
  const s = String(v ?? "").trim(), m = s.match(/^(-?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(%?)$/);
  if(!m) return s;
  const [, e, t, o, y] = m;
  if(!y && !o && !t.includes(",")) return s;
  const r = e + t.replace(/,/g, ".") + (o ? "," + o : "");
  return y ? "%" + r : r;
}
function duzelt(v){
  if(!(v.v >= 3)) (v.isler || []).forEach(j => { if(Array.isArray(j.ek)) j.ek = j.ek.map(([b, x]) => [baslikGuzel(b), trSayi(x)]); });
  (v.isler || []).forEach(j => {
    j.il = j.il || []; j.cats = j.cats || []; j.kmler = j.kmler || [];
    j.par = j.par || { it: "", st: "", ib: null, pb: null, iller: null };
    j.uz = Array.isArray(j.uz) ? j.uz : []; j.ek = Array.isArray(j.ek) ? j.ek : []; j.iti = Array.isArray(j.iti) ? j.iti : [];
    if(!Array.isArray(j.kutular)) j.kutular = j.pin ? [[j.pin[0] - 1.5, j.pin[1] - 1.5, 3, 3]] : [];
    if(Array.isArray(j.hat)) j.hat = { cizgi: j.hat.map(p => ({ r: "#dc2626", i: 0, p })), nok: [] };
    if(j.hat && !(j.hat.cizgi.length || j.hat.nok.length)) j.hat = null;
  });
  return v;
}
function kur(v){
  D = duzelt(v); ISLER = D.isler || [];
  agirSoz = null;
  // parçalı kayıttan okunduysa ağır kısım sonra gelir; dosyadan yüklendiyse hepsi elde
  D._agirTam = !D._parcali;
  D.itiKod = new Set(D.iti && D.iti.projeler ? Object.keys(D.iti.projeler) : (D.itiKodlar || []));
  tab = "home"; detay = null; isAra = ""; aramaAcik = false; parAra = ""; secKutu = null; mz = { s: 1, x: 0, y: 0 };
}

function dosyaSec(){
  let inp = document.getElementById("dosya-sec");
  if(!inp){
    inp = document.createElement("input");
    inp.type = "file"; inp.id = "dosya-sec"; inp.style.display = "none";
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0];
      inp.value = "";
      if(!f) return;
      try{
        const o = JSON.parse(await f.text());
        const v = o && o.format === "istakip-mobil" ? o.veri : o;
        if(!v || !Array.isArray(v.isler) || !v.olusturma) throw new Error("bicim");
        const eski = D && D.olusturma > v.olusturma;
        await veriYaz(v);
        kur(v);
        document.getElementById("tabs").style.display = "";
        ciz(); ust();
        bildir(eski ? "Dikkat: yüklenen dosya öncekinden daha eski (" + veriTarih() + ")" : "Veri yüklendi: " + veriTarih());
      }catch(e){
        if(D) bildir("Bu dosya İşTakip veri dosyası değil.");
        else hosgeldin("Bu dosya İşTakip veri dosyası değil. WhatsApp'taki .istakip dosyasını seçin.");
      }
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function bildir(m){
  document.querySelectorAll(".bildir").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "bildir"; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
document.addEventListener("click", e => { if(e.target.closest("[data-yukle]")){ e.preventDefault(); e.stopImmediatePropagation(); dosyaSec(); } }, true);
(async () => {
  const v = await veriOku();
  if(v){
    kur(v); ciz();
    // eski (tek parça) kayıt: bir kez parçalı olarak yeniden yazılır
    if(!v._parcali) setTimeout(() => veriYaz(v).catch(() => {}), 1500);

    else setTimeout(() => agirHazir(), 600);
  }
  else hosgeldin();
})();
