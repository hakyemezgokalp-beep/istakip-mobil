<body>
<div id="app"><main id="main"><div class="hos" id="acilis"><div class="hos-logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 3L4 21M16 3l4 18"/><path d="M12 4v3M12 10.5v3M12 17v3" stroke="#fde68a"/></svg></div><h1>İşTakip</h1><div class="hos-alt">Strateji Geliştirme Başmühendisliği<br><b>KGM</b> 7. Bölge Müdürlüğü</div><div class="acil-y"><i></i></div><div class="alt-not">YALNIZ GÖRÜNTÜLEME · VERİ BU TELEFONDA</div></div></main><nav class="tabs" id="tabs" style="display:none"></nav></div>
<script>
"use strict";
// ---------- Çizgi ikonlar (emoji yerine; her telefonda aynı görünür) ----------
const IKP = {
  ara: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  yukle: '<path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/><path d="M12 4v11M7.5 8.5L12 4l4.5 4.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  gunes: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  ay: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  harita: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  tl: '<path d="M9 3v16c4.5 0 8-2.5 8-7"/><path d="M5.5 10.5L13 7M5.5 14.5L13 11"/>',
  iti: '<path d="M3 12h18M6 8v8M12 8v8M18 8v8"/>',
  kmz: '<path d="M4 19c3-1 4-5 7-6s5 1 9-8"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/>',
  yt: '<path d="M3 11l18-8-8 18-2-8z"/>',
  pdf: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h5"/>',
  paylas: '<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>',
  drone: '<circle cx="5.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M7.5 7.5l2.5 2.5M16.5 7.5L14 10M7.5 16.5l2.5-2.5M16.5 16.5L14 14"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>',
  katman: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  konum: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  yol: '<path d="M8 3L4 21M16 3l4 18M12 4v3M12 10.5v3M12 17v3"/>',
  cetvel: '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
  yildiz: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  kopya: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  lejant: '<rect x="4" y="5" width="4" height="4" rx="1"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 7h9M11 17h9"/>',
  uyari: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.5"/>',
  yagmur: '<path d="M6 14h11a4 4 0 0 0 0-8 5 5 0 0 0-9.5 2A3.5 3.5 0 0 0 6 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',
  kmzYok: '<path d="M4 19c3-1 4-5 7-6s5 1 9-8" stroke-dasharray="2.5 3"/><path d="M3 3l18 18"/>',
  araYok: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5"/>',
  geri: '<path d="M15 5l-7 7 7 7"/>',
  egim: '<path d="M3 18h18"/><path d="M5 18L12 6l7 12" opacity=".5"/><path d="M12 6v12"/>'
};
const IK = (ad, cls) => `<svg class="ik${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true">${IKP[ad] || ""}</svg>`;

let D = null, ISLER = [];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const f2 = n => Number(n || 0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fold = s => String(s || "").toLocaleLowerCase("tr-TR").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/i̇/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u");
const p2 = n => String(n).padStart(2,"0");
const tarih = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
const ayYil = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})/); return m ? `${AY[+m[2]-1]} ${m[1]}` : ""; };
const oran = (i, p) => (i > 0 && p !== null && p !== undefined) ? Math.round(p / i * 100) : null;
const oranHtml = (o, tag) => o === null ? "" : `<${tag||"em"}${o < 100 ? ' class="neg"' : ""}>%${o}</${tag||"em"}>`;
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  par:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 10v5M9.5 11.5h4a1.5 1.5 0 0 1 0 3h-4"/></svg>'
};
const TABLAR = [["home","Anasayfa"],["map","Harita"]];
const GERI_AD = { home: "Anasayfa", map: "Harita" };
const byId = id => ISLER.find(j => j.id === id);
const sum = (j, k) => j.cats.reduce((s, c) => s + (c[k] || 0), 0);
const yuzde = (b, h) => h > 0 ? Math.min(100, Math.round(b / h * 100)) : (b > 0 ? 100 : 0);
const pct = j => yuzde(sum(j, "b"), sum(j, "h"));
const std = j => j.cats.map(c => c.ad).join(", ");

// tab: hangi alt sekme seçili; detay: { id, from } (from: geri dönülecek sekme)
let tab = "home", detay = null, isAra = "", parAra = "", secKutu = null;
let mz = { s: 1, x: 0, y: 0 };

function eskiUyari(){
  const gun = Math.floor((Date.now() - D.olusturma) / 86400000);
  return gun >= 7 ? `<div class="warn">${IK("uyari")} Bu veriler ${gun} günlük. WhatsApp'taki en son dosyayı yükleyin.</div>` : "";
}
function veriTarih(){
  const d = new Date(D.olusturma);
  return `${d.getDate()} ${AYK[d.getMonth()]} ${d.getFullYear()} · ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

// ---------- Genel Durum (masaüstündeki Standartlar / İl Bazlı Durum) ----------
// "Toplam KM'ye ekleme" seçili işler masaüstündeki gibi bu toplamlara girmez.
const STD_SIRA = ["BY-BSK", "BY-BSK-ON", "BY-SK", "BY-SK-BSK", "TY-BSK", "TY-SK", "TY-SK-BSK"];
const IL_SIRA = ["Amasya", "Samsun", "Ordu", "Sinop", "Tokat", "Çorum"];
const IKON_IS = '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#ea580c" stroke-width="1.8"/><rect x="9" y="2.5" width="6" height="3" rx="1" fill="#ea580c"/><line x1="8" y1="10" x2="16" y2="10" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="13.5" x2="16" y2="13.5" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="17" x2="13" y2="17" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/></svg>';
const IKON_HEDEF = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="1" fill="#16a34a"/></svg>';
const yerel = (k, v) => { try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
let gdAcik = true, gdSekme = yerel("istakip-mobil-gd-sekme") || "std", gdSec = null;
// Yılı içinde silinen işler o yılın toplamlarında "(silindi)" olarak kalır
const sayilan = () => ISLER.filter(j => !j.ekleme).concat(((D.silinen || {})[D.yil] || []).map((x, i) => ({ id: "sil" + i, ad: x.ad + " (silindi)", firma: x.firma, il: x.il || [], cats: x.cats || [], fh: 0, kmler: [], kutular: [], silindi: 1 })));
const stdSirala = ads => ads.sort((a, b) => (STD_SIRA.indexOf(a) + 1 || 99) - (STD_SIRA.indexOf(b) + 1 || 99) || a.localeCompare(b, "tr"));
function stdToplam(jobs){
  const t = {};
  jobs.forEach(j => j.cats.forEach(c => { const x = t[c.ad] || (t[c.ad] = { h: 0, b: 0 }); x.h += c.h || 0; x.b += c.b || 0; }));
  return t;
}
function cubuk(ad, h, b, extra, attrs){
  const yok = h === 0 && b > 0, p = yuzde(b, h), tag = attrs ? "button" : "div";
  return `<${tag} class="gr${extra || ""}"${attrs || ""}><div class="st"><span>${ad}</span><i>${yok ? "–" : "%" + p}</i></div>
<div class="bar${yok ? " yok" : ""}"><i style="width:${yok ? 100 : p}%"></i></div>
<div class="k">Hedef: ${yok ? "Sene başı hedefi yok" : f2(h) + " KM"} · Biten: ${f2(b)} KM</div></${tag}>`;
}
function isMini(j, ad){
  const c = j.cats.find(x => x.ad === ad);
  return `<button class="gi" data-is="${esc(j.id)}"><div class="st"><b>${esc(j.ad)}</b>${c ? `<i>${c.h === 0 && c.b > 0 ? "–" : "%" + yuzde(c.b, c.h)}</i>` : ""}</div><small>${c ? `Biten ${f2(c.b)} · Hedef ${c.h > 0 ? f2(c.h) : "–"} km · ` : ""}${esc(j.il.join(" · "))}</small></button>`;
}
// ---------- Genel Durum (profesyonel görünüm) ----------
// Standartlar: STANDART · BİTEN · HEDEF · % tablosu + TOPLAM; satıra dokununca
// o standarttaki işler açılır. İl Bazlı: il satırları (iş / fiziksel hedefli
// sayıları), açılınca o ilin standart tablosu. Açılan uzun listeler kendi
// kutusunda kayar.
function tabloSatir(ad, h, b, extra, attrs, ok){
  const yok = h === 0 && b > 0, p = yuzde(b, h), tag = attrs ? "button" : "div";
  return `<${tag} class="tr2${extra || ""}"${attrs || ""}><div class="l"><b>${ok ? `<em>${ok}</em>` : ""}${ad}</b><span class="v">${f2(b)}</span><span>${yok || !h ? "–" : f2(h)}</span><i>${yok ? "–" : p}</i></div><div class="bar${yok ? " yok" : ""}"><i style="width:${yok ? 100 : p}%"></i></div></${tag}>`;
}
function stdTablo(jobs, acilir){
  const t = stdToplam(jobs);
  const adlar = stdSirala(Object.keys(t));
  if(!adlar.length) return '<div class="gbos">Standart verisi yok.</div>';
  let H = 0, B = 0;
  const satirlar = adlar.map(ad => {
    H += t[ad].h; B += t[ad].b;
    if(!acilir) return tabloSatir(esc(ad), t[ad].h, t[ad].b, "", "");
    const acik = gdSec === "s:" + ad;
    return tabloSatir(esc(ad), t[ad].h, t[ad].b, acik ? " acik" : "", ` data-gd="s:${esc(ad)}"`, acik ? "▾" : "▸") +
      (acik ? `<div class="gac">${jobs.filter(j => j.cats.some(c => c.ad === ad)).map(j => isMini(j, ad)).join("") || '<div class="gbos">İş yok.</div>'}</div>` : "");
  }).join("");
  return satirlar + (adlar.length > 1 ? tabloSatir("TOPLAM", H, B, " top2", "") : "");
}
function genelDurum(){
  const jobs = sayilan();
  let govde = "", bas = "";
  if(gdSekme === "std"){
    bas = `<div class="tbh"><span>STANDART</span><span>BİTEN</span><span>HEDEF</span><span>%</span></div>`;
    govde = stdTablo(jobs, true);
  }else{
    bas = `<div class="tbh il"><span>İL</span><span>${IKON_IS}İŞ</span><span>${IKON_HEDEF}FİZ.</span></div>`;
    // İş sayıları bütün işlerle ("toplam KM'ye ekleme" seçililer dahil); KM tablosu yalnız toplama eklenenlerle
    const tumIs = ISLER;
    const iller = IL_SIRA.concat([...new Set(tumIs.filter(j => j.il.length === 1).flatMap(j => j.il))].filter(il => !IL_SIRA.includes(il)).sort((a, b) => a.localeCompare(b, "tr")));
    const satir = (key, ad, liste, ic) => { const acik = gdSec === key;
      return `<button class="tr2 ilr2${acik ? " acik" : ""}" data-gd="${esc(key)}"><div class="l"><b><em>${acik ? "▾" : "▸"}</em>${esc(ad)}</b><span>${liste.length}</span><span>${liste.filter(j => j.fh).length}</span></div></button>${acik ? `<div class="gac">${ic()}</div>` : ""}`; };
    govde = iller.map(il => {
      // Birden fazla ildeki işler il satırlarında değil, yalnız "Birden Fazla İl"de
      const tekIl = j => j.il.length === 1 && j.il[0] === il;
      const ilJobs = tumIs.filter(tekIl);
      return satir("i:" + il, il, ilJobs, () => `<div class="tbh" style="padding:4px 0 2px"><span>STANDART</span><span>BİTEN</span><span>HEDEF</span><span>%</span></div>` + stdTablo(jobs.filter(tekIl), false));
    }).join("");
    const cok = tumIs.filter(j => j.il.length > 1);
    govde += `<div class="ayrac"></div>` + satir("cok", "Birden Fazla İl", cok, () => cok.map(j => `<button class="gi" data-is="${esc(j.id)}"><b>${esc(j.ad)}</b><small>${esc(j.il.join(" · "))}</small></button>`).join("") || '<div class="gbos">Birden fazla ilde iş yok.</div>');
  }
  const d = new Date(D.olusturma);
  const IA = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
  const HA = '<svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="#fb923c"/></svg>';
  return `<div class="gd" id="gd"><div class="gdh3"><div class="t"><b>GENEL DURUM</b>${yillar().length > 1 ? `<button class="gyil" data-yilsec>${D.yil} ▾</button>` : `<span>${D.yil}</span>`}</div><div class="d">Veri: ${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}</div>
<div class="n"><div>${IA}<p style="margin:0"><b>${ISLER.length}</b><small>Toplam İş</small></p></div><div>${HA}<p style="margin:0"><b>${ISLER.filter(j => j.fh).length}</b><small>Fiziksel Hedefli</small></p></div></div></div>
<div class="gsek"><button data-gdsekme="std"${gdSekme === "std" ? ' class="on"' : ""}>Standartlar</button><button data-gdsekme="il"${gdSekme === "il" ? ' class="on"' : ""}>İl Bazlı</button></div>${bas}<div class="gdg" id="gdg">${govde}</div></div>`;
}

// ---------- Bu Hafta Girilen KM'ler ----------
// Verinin oluşturulduğu haftada (Pazartesi–Pazar) programa girilen KM aralıkları
function haftaPenceresi(){
  const n = new Date(D.olusturma);
  const pt = new Date(n); pt.setDate(n.getDate() - ((n.getDay() + 6) % 7)); pt.setHours(0, 0, 0, 0);
  const pz = new Date(pt); pz.setDate(pt.getDate() + 6); pz.setHours(23, 59, 59, 999);
  return { a: pt.getTime(), b: pz.getTime(), pt, pz };
}
const kmSayi = v => { const s = String(v ?? "").trim(); const m = s.match(/^(-?\d+)\s*\+\s*(\d+)$/); if(m) return +m[1] + +m[2] / 1000; const x = parseFloat(s.replace(",", ".")); return Number.isFinite(x) ? x : null; };
function haftaGirisleri(){
  const w = haftaPenceresi(), out = [];
  ISLER.forEach(j => { if(j.ekleme) return; (j.kmler || []).forEach(k => {
    if(!k.g || k.g < w.a || k.g > w.b) return;
    const s = kmSayi(k.a), e = kmSayi(k.e); if(s === null || e === null) return;
    out.push({ j, k, km: Math.abs(e - s) / (k.y ? 2 : 1) });
  }); });
  return out.sort((x, y) => y.k.g - x.k.g);
}
function buHafta(){
  const w = haftaPenceresi(), l = haftaGirisleri();
  const gun = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}`;
  return `<div class="bh"><h5>Bu Hafta Girilen KM'ler <em>${gun(w.pt)} – ${gun(w.pz)} · ${l.length} giriş</em></h5><div class="bhl">${l.length ? l.map(x => {
    const d = new Date(x.k.g);
    return `<button class="bi" data-is="${esc(x.j.id)}"><span class="a"><b>${esc(x.j.ad)}</b><span>${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} · ${esc(x.k.s)} · ${esc(x.k.a)} – ${esc(x.k.e)}${x.k.y ? " · yarısı" : ""}</span></span><span class="k">+${f2(x.km)} km<span>${D.yil}: ${f2(sum(x.j, "b"))}</span></span></button>`;
  }).join("") : '<div class="bos">Bu hafta henüz KM girilmedi.</div>'}</div></div>`;
}
function gdYenile(korunsun){ const g = document.getElementById("gd"); if(!g) return; const y = korunsun ? (document.getElementById("gdg")?.scrollTop || 0) : 0; g.outerHTML = genelDurum(); const n = document.getElementById("gdg"); if(n) n.scrollTop = y; }

  const oz = kmOzet(j);

    + catBlok(`${D.yil} Hedef`, c => c.h > 0 ? f2(c.h) + " km" : "–") + catBlok(`${yilEki(D.yil)} Yapılan${arBtn}`, c => f2(c.b) + " km") + arListe
    + catBlok(`${D.yil} Kalan`, c => c.h > 0 ? f2(Math.max(0, c.h - c.b)) + " km" : "–", " kln")
    + (oz.u !== null ? tek("Toplam Kalan", f2(oz.kalan) + " km", " kln") : "") + `</div>` : "";
  const yb = (k, ad, kisa) => `<button class="${kisa ? "mb" : "hc"}${(j[k] || "").trim() ? "" : " bos"}" data-yazi="${k}">${kisa ? ad : D.yil + " " + ad}</button>`;

// ---------- Hava durumu (çip + 10 günlük) ----------
// Yolun ortasındaki noktanın tahmini; internet gerekir, yoksa çip görünmez.
const havaOnbellek = {};
function isMerkez(j){
  if(!j.hat) return null;
  const c = anaCizgiler(j)[0] || j.hat.cizgi[0];
  if(c && c.p.length) return c.p[Math.floor(c.p.length / 2)];
  const n = j.hat.nok[0]; return n ? [n[0], n[1]] : null;
}
const HAVA_KOD = c => c === 0 ? ["Açık", "gunes"] : c <= 2 ? ["Parçalı bulutlu", "parcali"] : c === 3 ? ["Bulutlu", "bulut"] : c <= 48 ? ["Sisli", "sis"] : c <= 67 || (c >= 80 && c <= 82) ? ["Yağmurlu", "yagmur"] : c <= 77 || c === 85 || c === 86 ? ["Karlı", "kar"] : ["Fırtına / sağanak", "firtina"];
function havaSimge(tur, b){
  b = b || 22;
  const g = '<circle cx="9" cy="9" r="4.2" fill="#fbbf24"/>';
  const bulut = (f) => `<path d="M6.5 18h10a3.6 3.6 0 0 0 0-7.2 4.6 4.6 0 0 0-8.7 1.6A2.9 2.9 0 0 0 6.5 18z" fill="${f || "#e2e8f0"}" stroke="#94a3b8" stroke-width="1"/>`;
  const sv = x => `<svg width="${b}" height="${b}" viewBox="0 0 24 24" aria-hidden="true">${x}</svg>`;
  if(tur === "gunes") return sv('<circle cx="12" cy="12" r="5" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></g>');
  if(tur === "parcali") return sv(g + bulut());
  if(tur === "bulut") return sv(bulut("#cbd5e1"));
  if(tur === "sis") return sv('<g stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h13M4 17h15"/></g>');
  if(tur === "yagmur") return sv(bulut("#cbd5e1") + '<g stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"><path d="M9 20l-1 2.5M13 20l-1 2.5M17 20l-1 2.5"/></g>');
  if(tur === "kar") return sv(bulut("#e2e8f0") + '<g fill="#60a5fa"><circle cx="9" cy="21" r="1"/><circle cx="13" cy="22" r="1"/><circle cx="17" cy="21" r="1"/></g>');
  return sv(bulut("#94a3b8") + '<path d="M12 18l-2 3.5h3l-1.5 3" fill="none" stroke="#f59e0b" stroke-width="1.6"/>');
}
async function havaAl(j){
  const m = isMerkez(j); if(!m || navigator.onLine === false) return null;
  const k = j.id, o = havaOnbellek[k];
  if(o && Date.now() - o.t < 30 * 60000) return o.v;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${m[0].toFixed(3)}&longitude=${m[1].toFixed(3)}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FIstanbul&forecast_days=10`;
  try{
    const r = await fetch(u); if(!r.ok) return null;
    const v = await r.json(); havaOnbellek[k] = { t: Date.now(), v }; return v;
  }catch(e){ return null; }
}
const GUN = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
const havaYer = j => (j.il && j.il[0]) || "Yol";
function havaCipi(j){
  if(!j.hat) return "";
  const v = havaOnbellek[j.id] && havaOnbellek[j.id].v;
  if(!v){ setTimeout(() => havaDoldur(j), 0); return ""; }
  const c = v.current || {}, [, tur] = HAVA_KOD(c.weather_code);
  const yagis = (v.daily && v.daily.precipitation_probability_max || []).slice(1, 4).some(p => p >= 50);
  return `<button class="hava" data-hava="${esc(j.id)}">${havaSimge(tur, 18)}<b>${Math.round(c.temperature_2m)}°</b> ${esc(havaYer(j))}${yagis ? "<i></i>" : ""}</button>`;
}
async function havaDoldur(j){
  const v = await havaAl(j);
  if(!v || !detay || detay.id !== j.id) return;
  const s = document.getElementById("havaSatir"); if(s) s.innerHTML = havaCipi(j);
}
function havaPenceresi(j){
  const v = havaOnbellek[j.id] && havaOnbellek[j.id].v; if(!v) return;
  const c = v.current || {}, [ad, tur] = HAVA_KOD(c.weather_code), d = v.daily || {};
  const lo = Math.min(...d.temperature_2m_min), hi = Math.max(...d.temperature_2m_max), ar = Math.max(1, hi - lo);
  const yag = [];
  const satir = d.time.map((t, i) => {
    const g = new Date(t + "T12:00:00"), p = d.precipitation_probability_max[i], [, tr] = HAVA_KOD(d.weather_code[i]);
    const gn = i === 0 ? "Bugün" : GUN[g.getDay()];
    if(i > 0 && i < 4 && p >= 50) yag.push(["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"][g.getDay()]);
    const a = d.temperature_2m_min[i], b = d.temperature_2m_max[i];
    return `<div class="hg${p >= 50 ? " u" : ""}"><b>${gn}</b><span>${havaSimge(tr, 20)}</span><span class="yg">${p >= 20 ? "%" + p : ""}</span><span class="lo">${Math.round(a)}°</span><span class="trk"><i style="left:${(a - lo) / ar * 100}%;width:${Math.max(4, (b - a) / ar * 100)}%"></i></span><span class="hi">${Math.round(b)}°</span></div>`;
  }).join("");
  altSayfa(havaSimge(tur, 20), `Hava Durumu · ${havaYer(j)}`, j.ad, `<div class="hbug"><b>${Math.round(c.temperature_2m)}°</b><div>${ad}<br>Rüzgâr ${Math.round(c.wind_speed_10m || 0)} km/s · Nem %${Math.round(c.relative_humidity_2m || 0)}</div></div>${yag.length ? `<div class="hnot">${IK("yagmur")} ${yag.join(" ve ")} yağış bekleniyor.</div>` : ""}<div class="hlst">${satir}</div><div class="knot">Kaynak: Open-Meteo · yolun orta noktası</div>`);
}
document.addEventListener("click", e => {
  const h = e.target.closest("[data-hava]"); if(h && byId(h.dataset.hava)){ havaPenceresi(byId(h.dataset.hava)); return; }

function yilEki(y){
  const n = Number(y) % 100, b = n % 10, o = Math.floor(n / 10);

  const onlar = ["da", "da", "de", "da", "ta", "de", "ta", "te", "de", "da"];

function harita(){

function mapUygula(){
  const inn = document.getElementById("mapin"), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!inn || !w || !img) return;
  const W = w.clientWidth, H = w.clientHeight;
  inn.style.width = W + "px";
  const iw = W * mz.s, ih = img.offsetHeight * mz.s;
  mz.x = Math.min(0, Math.max(W - iw, mz.x));
  mz.y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, mz.y));
  inn.style.transform = `translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const bw = (2 / mz.s) + "px";
  inn.querySelectorAll(".kutu").forEach(k => { k.style.borderWidth = bw; });
}
function mapZoom(f, cx, cy){
  const w = document.getElementById("mapwrap"); if(!w) return;
  const ns = Math.min(10, Math.max(1, mz.s * f));
  cx = cx ?? w.clientWidth / 2; cy = cy ?? w.clientHeight / 2;
  mz.x = cx - (cx - mz.x) * ns / mz.s; mz.y = cy - (cy - mz.y) * ns / mz.s; mz.s = ns;
  mapUygula();
}
function resimHazir(f){
  const img = document.getElementById("mapimg"); if(!img) return;
  if(img.complete && img.naturalWidth) f(); else img.addEventListener("load", f, { once: true });
}
function mapKur(){
  const w = document.getElementById("mapwrap"); if(!w) return;
  resimHazir(mapUygula);
  let t0 = null, d0 = 0, s0 = 1, m0 = null, last = 0;
  w.addEventListener("touchstart", e => {
    if(e.target.closest(".sheet, .zoom, .hust")) return;
    if(e.touches.length === 2){ const [a, b] = e.touches; d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); s0 = mz.s; m0 = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; t0 = null; }
    else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y };
      const now = Date.now(); if(now - last < 300){ const r = w.getBoundingClientRect(); mapZoom(2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } last = now; }
  }, { passive: true });
  w.addEventListener("touchmove", e => {
    if(e.target.closest(".sheet, .hust")) return;
    e.preventDefault();
    const r = w.getBoundingClientRect();
    if(e.touches.length === 2 && d0){ const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); mapZoom((s0 * d / d0) / mz.s, m0.x - r.left, m0.y - r.top); }
    else if(e.touches.length === 1 && t0){ mz.x = e.touches[0].clientX - t0.x; mz.y = e.touches[0].clientY - t0.y; mapUygula(); }
  }, { passive: false });
  w.addEventListener("touchend", e => { if(e.touches.length === 0){ d0 = 0; t0 = null; } else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y }; d0 = 0; } });
  // fare (bilgisayarda açılırsa)
  let md = null, surukle = false;
  w.addEventListener("mousedown", e => { if(e.target.closest(".sheet, .zoom, .hust")) return; md = { x: e.clientX - mz.x, y: e.clientY - mz.y, ox: e.clientX, oy: e.clientY }; surukle = false; });
  window.onmousemove = e => { if(md){ if(Math.abs(e.clientX - md.ox) + Math.abs(e.clientY - md.oy) > 4) surukle = true; mz.x = e.clientX - md.x; mz.y = e.clientY - md.y; mapUygula(); } };
  window.onmouseup = () => { md = null; setTimeout(() => { surukle = false; }, 0); };
  w.addEventListener("click", e => { if(surukle){ e.stopPropagation(); e.preventDefault(); } }, true);
  w.addEventListener("wheel", e => { e.preventDefault(); const r = w.getBoundingClientRect(); mapZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}
function kutuyaGit(id){
  const j = byId(id), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!j || !j.kutular.length || !w) return;
  resimHazir(() => {
    const k = j.kutular[0], W = w.clientWidth, H = w.clientHeight, ih = img.offsetHeight;
    // kutu ekranın yaklaşık üçte birini kaplasın
    mz.s = Math.min(10, Math.max(1.5, Math.min(W * 0.35 / (k[2] / 100 * W), H * 0.3 / (k[3] / 100 * ih))));
    const cx = (k[0] + k[2] / 2) / 100 * W, cy = (k[1] + k[3] / 2) / 100 * ih;
    mz.x = W / 2 - cx * mz.s; mz.y = H * 0.38 - cy * mz.s;
    mapUygula();
  });
}

// ----- Drone uçuşları -----
// Süzme: zaman (son 1 / 3 ay / tümü) ve alan (işin hattına 1 km / tüm bölge).
// Aynı güzergâhta farklı zamanlarda yapılan uçuşlardan yalnız en yenisi

function hatKutusu(j){
  if(j._kutu) return j._kutu;
  let a0 = 90, a1 = -90, o0 = 180, o1 = -180;
  anaCizgiler(j).forEach(c => c.p.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }));

function rotaOrtak(r, s){

}
const rotaKutu = r => { let a0 = 90, a1 = -90, o0 = 180, o1 = -180; r.forEach(p => { a0 = Math.min(a0, p[0]); a1 = Math.max(a1, p[0]); o0 = Math.min(o0, p[1]); o1 = Math.max(o1, p[1]); }); return [a0, a1, o0, o1]; };
const kesisir = (x, y) => !(x[1] < y[0] - 0.0006 || y[1] < x[0] - 0.0006 || x[3] < y[2] - 0.0008 || y[3] < x[2] - 0.0008);

  const dr = D.katman && D.katman.drone; if(!dr || !kat) return [];

    l = l.filter(u => {

function kmBul(j, lat, lon){

// Yol Takip çizimini resme çevir: stiller öğelere işlenir, SVG → canvas → JPEG
async function itiResimleri(kod){
  const pr = D.iti.projeler[kod]; if(!pr) return [];
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-10000px;top:0;width:4000px;background:#fff";
  document.body.appendChild(host);
  host.attachShadow({ mode: "open" }).innerHTML = `<style>${itiCss()}</style><div class="kap">${pr.html}</div>`;
  const ozellik = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "font-size", "font-family", "font-weight", "font-style", "text-anchor", "dominant-baseline", "visibility", "display", "letter-spacing"];
  const svgs = [...host.shadowRoot.querySelectorAll("svg")].filter(x => !x.parentElement.closest("svg") && x.viewBox && x.viewBox.baseVal && x.viewBox.baseVal.width);
  const out = [];
  for(const s of svgs){
    const vb = s.viewBox.baseVal;
    s.style.width = vb.width + "px"; s.style.height = vb.height + "px";
    const kopya = s.cloneNode(true);
    const kaynak = [s, ...s.querySelectorAll("*")], hedef = [kopya, ...kopya.querySelectorAll("*")];
    kaynak.forEach((el, i) => { const cs = getComputedStyle(el); hedef[i].setAttribute("style", ozellik.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
    kopya.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    kopya.setAttribute("width", vb.width); kopya.setAttribute("height", vb.height);
    const metin = new XMLSerializer().serializeToString(kopya);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("İtinerer çizimi resme çevrilemedi")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(metin); });
    const k = Math.min(3, 3600 / vb.width, 2400 / vb.height);
    const c = document.createElement("canvas"); c.width = Math.round(vb.width * k); c.height = Math.round(vb.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out.push({ veri: c.toDataURL("image/jpeg", 0.9), w: c.width, h: c.height });
  }
  host.remove();
  return out;
}

function pdfKutu(doc, j, y){

function pdfTablo(doc, y, basliklar, satirlar){

// KM Bilgileri: İhale Uzunluğu ve <yıl> Öncesi tek (iş toplamı); sonrası
// (Hedef, Yapılan, Kalan) standart standart; en altta Toplam Kalan.
// Fiziksel gerçekleşme yalnız çubuklarda, burada yok.
// KM Bilgileri sütunları: bu yılın standartları + öncesinde biten olan
// standartlar (o: <yıl> Öncesi Yapılan). Eski veride (onc yok) null döner.
function kmKolonlar(j){
  if(!Array.isArray(j.onc)) return null;
  const k = j.cats.map(c => ({ ad: c.ad, h: c.h, b: c.b, o: 0 }));
  j.onc.forEach(x => { const c = k.find(y => y.ad === x.ad); if(c) c.o = x.o; else k.push({ ad: x.ad, h: 0, b: 0, o: x.o }); });
  return k.sort((a, b) => (STD_SIRA.indexOf(a.ad) + 1 || 99) - (STD_SIRA.indexOf(b.ad) + 1 || 99));
}
function kmOzet(j){
  const uz = j.uz || [];
  const top = k => uz.reduce((t, r) => t + (Number(r[k]) || 0), 0);
  const u = uz.length && uz.some(r => r.u !== null && r.u !== undefined) ? top("u") : null;
  const o = uz.length ? top("o") : null;
  const yap = j.cats.reduce((t, c) => t + (Number(c.b) || 0), 0);
  return { u, o, kalan: u === null ? null : Math.max(0, u - (o || 0) - yap) };
}
function pdfBilgi(doc, j, y){
  const a = PDF.a;
  y = pdfYer(doc, y, 24 * a);
  y = pdfBolumBaslik(doc, y, "KM Bilgileri");
  const km = v => v === null || v === undefined ? "–" : f2(v) + " km";
  const oz = kmOzet(j);
  if(!j.cats.length && oz.u === null){
    doc.setFont("DV", "normal"); doc.setFontSize(9 * PDF.o); doc.setTextColor(...PDF.gri); doc.text("Bu iş için km bilgisi girilmemiş.", PDF.x0 + 1.5, y + 4); return y + 8 * a;
  }
  if(oz.u !== null) y = pdfSatir(doc, y, "İhale Uzunluğu", km(oz.u));
  // <yıl> Öncesi Yapılan standart standart tabloda (yeni veri); eski veride tek satır toplam
  const kol = oz.u !== null ? kmKolonlar(j) : null;
  const onceTabloda = !!(kol && kol.length && oz.o !== null);
  if(oz.o !== null && !onceTabloda) y = pdfSatir(doc, y, `${D.yil} Öncesi Yapılan`, km(oz.o));
  const K = onceTabloda ? kol : j.cats;
  if(K.length){
    y = pdfTablo(doc, y + 2 * a, K.map(c => c.ad), (onceTabloda ? [[`${D.yil} Öncesi Yapılan`, K.map(c => km(c.o || 0))]] : []).concat([
      [`${D.yil} Hedef`, K.map(c => c.h > 0 ? km(c.h) : "–")],
      [`${yilEki(D.yil)} Yapılan`, K.map(c => km(c.b))],
      [`${D.yil} Kalan`, K.map(c => c.h > 0 ? km(Math.max(0, c.h - c.b)) : "–"), true]

  if(oz.u !== null) y = pdfSatir(doc, y, "Toplam Kalan", km(oz.kalan), true);
  return y + 3 * a;
}

// Excel'de seçilen sütunlar Excel sırasıyla; İhale/Proje Bedeli de seçildiyse

function pdfIhaleListe(j, tl){
  const p = j.par, bedel = b => { const f = fold(b); return /proje\s*bedel/.test(f) ? p.pb : /ihale\s*(bedel|tutar)/.test(f) ? p.ib : undefined; };

// 16:9 harita (w genişlik, h = w·9/16). Programda atanmış harita resmi
// varsa: resmin içine sığan en büyük 16:9 alan, kırmızı yol hattı ortada

    let popup = null, konumIsaret = null, guncelZaman = null;
    // arazi kapanırsa (karo hatası) yarım kalan uçuş yeniden yapılır
    function gitIc(ll, ani){ if(!ll || !ll.length) return; hedef = { ll, t: Date.now() }; map.fitBounds(sinirla(ll), { padding: 50, pitch: Math.max(map.getPitch(), 45), bearing: map.getBearing(), duration: ani ? 0 : 2000, maxZoom: 16, essential: true }); }
    return {
      map, yuklendi, kamera,
      // art arda gelen güncellemeler tek seferde yapılır (akıcılık)
      guncelle(){ clearTimeout(guncelZaman); guncelZaman = setTimeout(() => yuklendi.then(() => { son = topla(lm); ["cizgi", "nokta", "serit", "perde"].forEach(k => map.getSource(k) && map.getSource(k).setData(son[k])); htmlKur(); }), 120); },
      git(ll, ani){ gitIc(ll, ani); },
      // K↑: kuzey yukarı ve tepeden bakış
      kuzey(){ map.easeTo({ bearing: 0, pitch: 0, duration: 700 }); },
      // eğim düğmesi: eğik ↔ tepeden
      egim(){ map.easeTo({ pitch: map.getPitch() > 20 ? 0 : 60, duration: 700 }); return map.getPitch() <= 20; },
      vurgu(id){

        yuklendi.then(() => {
          if(secUcus < 0){ map.setPaintProperty("serit", "fill-extrusion-color", ["get", "renk"]); map.setPaintProperty("serit", "fill-extrusion-opacity", .95); map.setPaintProperty("perde", "fill-extrusion-opacity", .16); map.setPaintProperty("cizgi", "line-opacity", ["get", "op"]); map.setPaintProperty("nokta", "circle-opacity", 1); return; }
          const s = (a, b) => ["case", ["==", ["get", "ucusId"], secUcus], a, b];
          map.setPaintProperty("serit", "fill-extrusion-opacity", 1);
          map.setPaintProperty("serit", "fill-extrusion-color", s("#c2410c", ["get", "renk"]));
          map.setPaintProperty("perde", "fill-extrusion-opacity", .1);
          map.setPaintProperty("cizgi", "line-opacity", ["case", ["==", ["get", "yan"], 1], s(1, .2), ["get", "op"]]);
          map.setPaintProperty("nokta", "circle-opacity", ["case", ["==", ["get", "yan"], 1], s(1, .25), 1]);
        });
      },
      konum(lat, lng){ if(!konumIsaret){ const d = document.createElement("div"); d.style.cssText = "width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.35)"; konumIsaret = new ml.Marker({ element: d }); } konumIsaret.setLngLat([lng, lat]).addTo(map); map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 15), duration: 1800 }); },
      popup(ll, html){ if(popup) popup.remove(); popup = new ml.Popup({ closeButton: false, className: "uc-pop", offset: 10, maxWidth: "260px" }).setLngLat([ll.lng, ll.lat]).setHTML(html).addTo(map); return popup; },
      popupKapat(){ if(popup){ popup.remove(); popup = null; } },
      yokEt(){ iptal(); clearInterval(yanZaman); clearTimeout(guncelZaman); try{ map.remove(); }catch(e){} }
    };
  }
  return { ac, hazir };
})();

// ---------- arama: eşleşen yazıyı vurgulama ----------
function vurgula(metin, q){
  const t = String(metin || ""), k = fold(q).trim();
  if(!k) return esc(t);
  const f = fold(t);
  if(f.length !== t.length) return esc(t);
  let out = "", i = 0, n;
  while((n = f.indexOf(k, i)) >= 0){ out += esc(t.slice(i, n)) + "<mark>" + esc(t.slice(n, n + k.length)) + "</mark>"; i = n + k.length; }
  return out + esc(t.slice(i));
}

function hatBoyu(){
  if(hatIs._boy) return hatIs._boy;
  const c = anaCizgiler(hatIs).slice().sort((a, b) => b.p.length - a.p.length)[0];
  const kum = [0]; for(let i = 1; i < c.p.length; i++) kum.push(kum[i - 1] + haversine(c.p[i - 1], c.p[i]));
  return (hatIs._boy = { p: c.p, kum });
}
function hattaYer(lat, lon){
  const h = hatBoyu(), k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = p => [(p[1] - lon) * k * M, (p[0] - lat) * M];
  let en = null;
  for(let i = 1; i < h.p.length; i++){
    const A = xy(h.p[i - 1]), B = xy(h.p[i]), dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
    let t = L2 ? -(A[0] * dx + A[1] * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(A[0] + t * dx, A[1] + t * dy);
    if(!en || d < en.d) en = { d, i, t, s: h.kum[i - 1] + t * (h.kum[i] - h.kum[i - 1]), p: [h.p[i - 1][0] + t * (h.p[i][0] - h.p[i - 1][0]), h.p[i - 1][1] + t * (h.p[i][1] - h.p[i - 1][1])] };
  }
  return en;
}
function hatParcasi(a, b){
  const h = hatBoyu(), [x, y] = a.s <= b.s ? [a, b] : [b, a];
  const out = [x.p];
  for(let i = x.i; i < y.i; i++) out.push(h.p[i]);
  out.push(y.p);
  return out;
}

// Veri yalnızca bu telefonda (IndexedDB) saklanır; hiçbir yere gönderilmez.
const DB_AD = "istakip-mobil", DEPO = "veri";
function idb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(DB_AD, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DEPO);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
// Hızlı açılış için veri iki parça saklanır: "son" (işler, km'ler — açılışta
// okunur) ve "agir" (bölge haritası resmi, itinerer çizimleri, genel KMZ /
// drone katmanları — gerektiğinde okunur).
async function idbOku(anahtar){
  const db = await idb();
  return await new Promise(ok => { const t = db.transaction(DEPO).objectStore(DEPO).get(anahtar); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); });
}
async function veriOku(){
  try{ return await idbOku("son"); }
  catch(e){ try{ return JSON.parse(localStorage.getItem("istakip-mobil-veri") || "null"); }catch(_){ return null; } }
}
function bol(v){
  const agir = { harita: v.harita || "", iti: v.iti || null, katman: v.katman || null, hResim: v.hResim || null };
  const kodlar = v.iti && v.iti.projeler ? Object.keys(v.iti.projeler) : (v.itiKodlar || []);
  const cekirdek = { ...v, harita: null, iti: null, katman: null, hResim: null, itiKodlar: kodlar, haritaVar: !!(v.harita || v.haritaVar), katmanVar: !!(v.katman || v.katmanVar), _parcali: 1 };
  return { cekirdek, agir };
}
async function veriYaz(v){
  const { cekirdek, agir } = bol(v);
  try{
    const db = await idb();
    await new Promise((ok, no) => { const t = db.transaction(DEPO, "readwrite"); const st = t.objectStore(DEPO); st.put(cekirdek, "son"); st.put(agir, "agir"); t.oncomplete = ok; t.onerror = () => no(t.error); });
  }catch(e){ try{ localStorage.setItem("istakip-mobil-veri", JSON.stringify(v)); }catch(_){} }
}

  if(!D || D._agirTam) return Promise.resolve();

}

// Eski (1. sürüm) dosyalar da açılsın
// Excel başlığı tamamı büyük harfse Türkçe kurala göre ilk harfler büyük;
// ABD biçimli sayılar Türkçe biçime (yalnız eski dosyalarda gerekir)
function baslikGuzel(h){
  const s = String(h || ""), harf = s.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, "");
  if(!harf || harf !== harf.toLocaleUpperCase("tr-TR")) return s;
  return s.split(/(\([^)]*\))/).map(p => p.startsWith("(") ? p : p.toLocaleLowerCase("tr-TR").replace(/(^|[\s\-/.])([a-zçğıöşü])/g, (m, a, b) => a + b.toLocaleUpperCase("tr-TR"))).join("");
}
function trSayi(v){
  const s = String(v ?? "").trim(), m = s.match(/^(-?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(%?)$/);
  if(!m) return s;
  const [, e, t, o, y] = m;
  if(!y && !o && !t.includes(",")) return s;
  const r = e + t.replace(/,/g, ".") + (o ? "," + o : "");
  return y ? "%" + r : r;
}
function duzelt(v){
  if(!(v.v >= 3)) (v.isler || []).forEach(j => { if(Array.isArray(j.ek)) j.ek = j.ek.map(([b, x]) => [baslikGuzel(b), trSayi(x)]); });
  (v.isler || []).forEach(j => {
    j.il = j.il || []; j.cats = j.cats || []; j.kmler = j.kmler || [];
    j.par = j.par || { it: "", st: "", ib: null, pb: null, iller: null };
    j.uz = Array.isArray(j.uz) ? j.uz : []; j.ek = Array.isArray(j.ek) ? j.ek : []; j.iti = Array.isArray(j.iti) ? j.iti : [];
    if(!Array.isArray(j.kutular)) j.kutular = j.pin ? [[j.pin[0] - 1.5, j.pin[1] - 1.5, 3, 3]] : [];
    if(Array.isArray(j.hat)) j.hat = { cizgi: j.hat.map(p => ({ r: "#dc2626", i: 0, p })), nok: [] };
    if(j.hat && !(j.hat.cizgi.length || j.hat.nok.length)) j.hat = null;
  });
  return v;
}
function kur(v){
  D = duzelt(v); ISLER = D.isler || [];
  agirSoz = null;
  // parçalı kayıttan okunduysa ağır kısım sonra gelir; dosyadan yüklendiyse hepsi elde
  D._agirTam = !D._parcali;
  // yıl: bulunduğumuz yıl dosyada varsa o, yoksa dosyanın yılı
  { const by = new Date().getFullYear(); secYil = yillar().includes(by) ? by : D.yil; if(secYil !== D.yil || D.isler.some(j => j.yillik)) yilUygula(secYil); }
  D.itiKod = new Set(D.iti && D.iti.projeler ? Object.keys(D.iti.projeler) : (D.itiKodlar || []));
  tab = "home"; detay = null; isAra = ""; aramaAcik = false; parAra = ""; secKutu = null; mz = { s: 1, x: 0, y: 0 };
}
function hosgeldin(mesaj){
  document.getElementById("tabs").style.display = "none";
  document.getElementById("main").innerHTML = `<div class="hos">
<div class="hos-logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 3L4 21M16 3l4 18"/><path d="M12 4v3M12 10.5v3M12 17v3" stroke="#fde68a"/></svg></div>

${mesaj ? `<div class="hos-hata">${esc(mesaj)}</div>` : ""}
<div class="hos-not"><b>Nasıl kullanılır?</b><br>1. WhatsApp'taki en son <b>.istakip</b> dosyasını telefona kaydedin (dosyaya dokunun → Paylaş → <b>Dosyalar'a Kaydet</b>).<br>2. Yukarıdaki düğmeyle o dosyayı seçin.<br>3. Safari'de <b>Paylaş → Ana Ekrana Ekle</b> derseniz uygulama gibi açılır.<br><br>Veriler yalnızca bu telefonda saklanır, internete gönderilmez. Yeni dosya yüklenince eskisinin yerine geçer.</div>
</div>`;
}
function dosyaSec(){
  let inp = document.getElementById("dosya-sec");
  if(!inp){
    inp = document.createElement("input");
    inp.type = "file"; inp.id = "dosya-sec"; inp.style.display = "none";
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0];
      inp.value = "";
      if(!f) return;
      try{
        const o = JSON.parse(await f.text());
        const v = o && o.format === "istakip-mobil" ? o.veri : o;
        if(!v || !Array.isArray(v.isler) || !v.olusturma) throw new Error("bicim");
        const eski = D && D.olusturma > v.olusturma;
        await veriYaz(v);
        kur(v);
        document.getElementById("tabs").style.display = "";
        ciz(); ust();
        bildir(eski ? "Dikkat: yüklenen dosya öncekinden daha eski (" + veriTarih() + ")" : "Veri yüklendi: " + veriTarih());
      }catch(e){
        if(D) bildir("Bu dosya İşTakip veri dosyası değil.");
        else hosgeldin("Bu dosya İşTakip veri dosyası değil. WhatsApp'taki .istakip dosyasını seçin.");
      }
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function bildir(m){
  document.querySelectorAll(".bildir").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "bildir"; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
document.addEventListener("click", e => { if(e.target.closest("[data-yukle]")){ e.preventDefault(); e.stopImmediatePropagation(); dosyaSec(); } }, true);
(async () => {
  const v = await veriOku();
  if(v){
    kur(v); ciz();
    // eski (tek parça) kayıt: bir kez parçalı olarak yeniden yazılır
    if(!v._parcali) setTimeout(() => veriYaz(v).catch(() => {}), 1500);
    // ağır kısım boşta okunur; kullanıcı haritaya geçtiğinde hazır olur
    else setTimeout(() => agirHazir(), 600);
  }
  else hosgeldin();
})();

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
