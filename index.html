<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#f1f5f9; color:#1f2937; overscroll-behavior:none; }
button{ font-family:inherit; cursor:pointer; }
#app{ display:flex; flex-direction:column; height:100%; max-width:640px; margin:0 auto; background:#f1f5f9; position:relative; }
main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }
.tabs{ flex:none; display:flex; justify-content:space-around; background:#fff; border-top:1px solid #e5e7eb; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:#94a3b8; font-weight:600; background:none; border:none; padding:2px 0; }
.tab svg{ width:22px; height:22px; }
.tab.on{ color:#ea580c; }
.pad{ padding:12px 14px 18px; display:flex; flex-direction:column; gap:10px; }
.card{ background:#fff; border-radius:16px; padding:12px 14px; box-shadow:0 1px 3px rgba(15,23,42,.06); }

/* üst yazı */
.hdr{ padding:calc(12px + env(safe-area-inset-top)) 16px 12px; background:#fff; border-bottom:1px solid #eef0f3; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }

.hdr .k{ font-size:12.5px; color:#6b7280; margin-top:2px; } .hdr .k b{ color:#c2410c; letter-spacing:.1em; font-size:11px; margin-right:4px; }

.hdr > div:first-child{ min-width:0; flex:1; }
.hbtn{ display:flex; gap:6px; flex:none; }

.yukle{ flex:none; background:#fff7ed; border:1px solid #fed7aa; color:#c2410c; font-weight:700; font-size:12px; border-radius:10px; padding:7px 8px; height:33px; }
.top{ background:#fff; padding:calc(12px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid #eef0f3; position:sticky; top:0; z-index:5; }

.top .search{ background:#f1f5f9; border-color:#f1f5f9; }
.search:focus{ border-color:#fdba74; }
.sec{ font-size:12px; font-weight:800; color:#9ca3af; letter-spacing:.06em; text-transform:uppercase; margin:4px 2px -2px; }
/* genel durum: ekranı doldurur, liste kendi içinde kayar */
main.dolu{ display:flex; flex-direction:column; overflow:hidden !important; }
main.dolu > .pad{ flex:1; min-height:0; }
main.dolu .gd{ flex:1; min-height:0; display:flex; flex-direction:column; }
.gdg{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; margin:0 -6px; padding:0 6px 4px; }
.gdg .gac{ max-height:none; overflow:visible; }
/* genel durum (koyu başlık) */
.gd{ padding:0 !important; overflow:hidden; border:none !important; box-shadow:0 4px 18px rgba(15,23,42,.10); }
.gdh2{ background:linear-gradient(135deg,#1f2937 0%,#3b2417 60%,#7c2d12 100%); color:#fff; padding:14px 16px; flex:none; }
.gdh2 .t{ display:flex; justify-content:space-between; align-items:center; }
.gdh2 .t b{ font-size:15px; letter-spacing:.02em; }
.gdh2 .t span{ font-size:11px; font-weight:800; background:rgba(251,146,60,.22); color:#fdba74; border:1px solid rgba(251,146,60,.45); border-radius:20px; padding:2px 9px; letter-spacing:.06em; }

.gdh2 .n b{ display:block; font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.gdh2 .n small{ display:block; font-size:11px; color:rgba(255,255,255,.7); margin-top:4px; letter-spacing:.04em; text-transform:uppercase; }
.gd .seg{ margin:12px 14px 6px; flex:none; }
.gd .gdg{ margin:0 !important; padding:0 14px 8px !important; }
.ilsay{ display:grid !important; grid-template-columns:40px 40px; gap:6px !important; }
.ilsay span{ font-variant-numeric:tabular-nums; }
.ilsay svg{ flex:none; }
.ilbas{ display:flex; justify-content:flex-end; padding:2px 2px 0; }
.ilbas div{ display:grid; grid-template-columns:40px 40px; gap:6px; }
.ilbas span{ display:flex; align-items:center; gap:4px; font-size:10px; color:#94a3b8; font-weight:700; }
.ilbas svg{ width:12px; height:12px; }
.gr.ilr.acik{ margin:0; padding-left:8px; padding-right:2px; }
/* genel durum */
.gd{ background:#fff; border-radius:16px; border:1px solid #eef0f3; padding:12px 14px; }
.gdh{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:none; border:none; padding:0; width:100%; text-align:left; }

.gdh span{ color:#94a3b8; font-size:13px; }

.ilr{ display:flex; justify-content:space-between; align-items:center; }
.ilsay{ display:flex; gap:10px; font-size:12.5px; font-weight:800; color:#374151; }
.ilsay span{ display:flex; align-items:center; gap:3px; } .ilsay svg{ width:14px; height:14px; }
.gac{ margin:2px 0 8px 6px; padding:2px 0 2px 10px; border-left:3px solid #fb923c; max-height:260px; overflow-y:auto; }
.gac .gr{ padding:7px 2px 6px; } .gac .gr .st{ font-size:12.5px; font-weight:700; color:#374151; }
.gi{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #f1f5f9; padding:7px 2px; color:inherit; }
.gi:last-child{ border-bottom:none; }
.gi b{ display:block; font-size:12.5px; color:#374151; } .gi small{ font-size:11px; color:#94a3b8; }
.gi .st{ display:flex; justify-content:space-between; gap:8px; } .gi .st i{ font-style:normal; color:#dc2626; font-weight:800; font-size:12px; }
.ayrac{ border-top:2px solid #fed7aa; margin:8px 0 0; }

.jr{ background:#fff; border-radius:14px; border:1px solid #eef0f3; padding:11px 13px; }
.jr .t{ display:flex; justify-content:space-between; gap:8px; } .jr .t b{ font-size:14px; color:#111827; } .jr .t i{ font-style:normal; font-weight:800; color:#dc2626; font-size:13px; white-space:nowrap; }

.sr{ margin-top:7px; }

.sr .st span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }

/* detay */
.dh{ background:linear-gradient(135deg,#1f2937,#7c2d12); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 16px; }

.kv{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }

.rng:last-child{ border:none; }
.rng b{ color:#111827; }
.rng span{ color:#94a3b8; font-size:11.5px; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.acb{ background:#fff7ed; border:1px solid #fdba74; color:#c2410c; font-weight:700; font-size:11.5px; border-radius:8px; padding:3px 8px; }
.rng{ align-items:center; }
.btn{ display:block; width:100%; background:#ea580c; color:#fff; text-align:center; font-weight:800; border-radius:12px; padding:12px; font-size:14px; border:none; }
.btn.alt{ background:#fff; color:#c2410c; border:1px solid #fed7aa; }

.btn.iti{ background:#1e3a5f; }

.kv.uz{ align-items:flex-start; }

.kv.uz em{ font-style:normal; color:#c2410c; font-weight:800; font-size:11.5px; margin-right:3px; }

.btn.bos{ opacity:.4; }

.mhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }

.hos-logo{ width:68px; height:68px; border-radius:18px; background:linear-gradient(135deg,#f97316,#c2410c); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(0,0,0,.3); }

</style>
</head>
<body>
<div id="app"><main id="main"></main><nav class="tabs" id="tabs"></nav></div>
<script src="leaflet.js"></script>
<script>
"use strict";
let D = null, ISLER = [];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const f2 = n => Number(n || 0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fold = s => String(s || "").toLocaleLowerCase("tr-TR").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/i̇/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u");
const p2 = n => String(n).padStart(2,"0");
const tarih = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
const ayYil = iso => { const m = String(iso||"").match(/^(\d{4})-(\d{2})/); return m ? `${AY[+m[2]-1]} ${m[1]}` : ""; };
const oran = (i, p) => (i > 0 && p !== null && p !== undefined) ? Math.round(p / i * 100) : null;
const oranHtml = (o, tag) => o === null ? "" : `<${tag||"em"}${o < 100 ? ' class="neg"' : ""}>%${o}</${tag||"em"}>`;
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  par:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 10v5M9.5 11.5h4a1.5 1.5 0 0 1 0 3h-4"/></svg>'
};
const TABLAR = [["home","Anasayfa"],["map","Harita"]];
const GERI_AD = { home: "Anasayfa", map: "Harita" };
const byId = id => ISLER.find(j => j.id === id);
const sum = (j, k) => j.cats.reduce((s, c) => s + (c[k] || 0), 0);
const yuzde = (b, h) => h > 0 ? Math.min(100, Math.round(b / h * 100)) : (b > 0 ? 100 : 0);
const pct = j => yuzde(sum(j, "b"), sum(j, "h"));
const std = j => j.cats.map(c => c.ad).join(", ");

// tab: hangi alt sekme seçili; detay: { id, from } (from: geri dönülecek sekme)
let tab = "home", detay = null, isAra = "", parAra = "", secKutu = null;
let mz = { s: 1, x: 0, y: 0 };

function eskiUyari(){
  const gun = Math.floor((Date.now() - D.olusturma) / 86400000);
  return gun >= 7 ? `<div class="warn">⚠️ Bu veriler ${gun} günlük. WhatsApp'taki en son dosyayı yükleyin.</div>` : "";
}
function veriTarih(){
  const d = new Date(D.olusturma);
  return `${d.getDate()} ${AYK[d.getMonth()]} ${d.getFullYear()} · ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

// ---------- Genel Durum (masaüstündeki Standartlar / İl Bazlı Durum) ----------
// "Toplam KM'ye ekleme" seçili işler masaüstündeki gibi bu toplamlara girmez.
const STD_SIRA = ["BY-BSK", "BY-BSK-ON", "BY-SK-BSK", "TY-BSK", "TY-SK", "TY-SK-BSK"];
const IL_SIRA = ["Amasya", "Samsun", "Ordu", "Sinop", "Tokat", "Çorum"];
const IKON_IS = '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#ea580c" stroke-width="1.8"/><rect x="9" y="2.5" width="6" height="3" rx="1" fill="#ea580c"/><line x1="8" y1="10" x2="16" y2="10" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="13.5" x2="16" y2="13.5" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="17" x2="13" y2="17" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round"/></svg>';
const IKON_HEDEF = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#16a34a" stroke-width="2"/><circle cx="12" cy="12" r="1" fill="#16a34a"/></svg>';
const yerel = (k, v) => { try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
let gdAcik = true, gdSekme = yerel("istakip-mobil-gd-sekme") || "std", gdSec = null;
const sayilan = () => ISLER.filter(j => !j.ekleme);
const stdSirala = ads => ads.sort((a, b) => (STD_SIRA.indexOf(a) + 1 || 99) - (STD_SIRA.indexOf(b) + 1 || 99) || a.localeCompare(b, "tr"));
function stdToplam(jobs){
  const t = {};
  jobs.forEach(j => j.cats.forEach(c => { const x = t[c.ad] || (t[c.ad] = { h: 0, b: 0 }); x.h += c.h || 0; x.b += c.b || 0; }));
  return t;
}
function cubuk(ad, h, b, extra, attrs){
  const yok = h === 0 && b > 0, p = yuzde(b, h), tag = attrs ? "button" : "div";
  return `<${tag} class="gr${extra || ""}"${attrs || ""}><div class="st"><span>${ad}</span><i>${yok ? "–" : "%" + p}</i></div>
<div class="bar${yok ? " yok" : ""}"><i style="width:${yok ? 100 : p}%"></i></div>
<div class="k">Hedef: ${yok ? "Sene başı hedefi yok" : f2(h) + " KM"} · Biten: ${f2(b)} KM</div></${tag}>`;
}
function isMini(j, ad){
  const c = j.cats.find(x => x.ad === ad);
  return `<button class="gi" data-is="${esc(j.id)}"><div class="st"><b>${esc(j.ad)}</b>${c ? `<i>%${yuzde(c.b, c.h)}</i>` : ""}</div><small>${c ? `${f2(c.b)} / ${f2(c.h)} km · ` : ""}${esc(j.il.join(" · "))}</small></button>`;
}
function genelDurum(){
  const jobs = sayilan();
  let govde = "";
  if(gdAcik){
    if(gdSekme === "std"){
      const t = stdToplam(jobs);
      govde = stdSirala(Object.keys(t)).map(ad => {
        const acik = gdSec === "s:" + ad;
        return cubuk(`<em>${acik ? "▾" : "▸"}</em>${esc(ad)}`, t[ad].h, t[ad].b, acik ? " acik" : "", ` data-gd="s:${esc(ad)}"`) +
          (acik ? `<div class="gac">${jobs.filter(j => j.cats.some(c => c.ad === ad)).map(j => isMini(j, ad)).join("") || '<div class="gbos">İş yok.</div>'}</div>` : "");
      }).join("") || '<div class="gbos">Standart verisi yok.</div>';
    }else{
      const iller = IL_SIRA.concat([...new Set(jobs.flatMap(j => j.il))].filter(il => !IL_SIRA.includes(il)).sort((a, b) => a.localeCompare(b, "tr")));
      const satir = (key, ad, liste, ic) => { const acik = gdSec === key;
        return `<button class="gr ilr${acik ? " acik" : ""}" data-gd="${esc(key)}"><span class="st" style="flex:1"><span><em>${acik ? "▾" : "▸"}</em>${esc(ad)}</span></span><span class="ilsay"><span title="Toplam iş">${IKON_IS}${liste.length}</span><span title="Fiziksel hedefli">${IKON_HEDEF}${liste.filter(j => j.fh).length}</span></span></button>${acik ? `<div class="gac">${ic()}</div>` : ""}`; };
      govde = iller.map(il => {
        const ilJobs = jobs.filter(j => j.il.includes(il));
        return satir("i:" + il, il, ilJobs, () => { const t = stdToplam(ilJobs); return stdSirala(Object.keys(t)).map(ad => cubuk(esc(ad), t[ad].h, t[ad].b, "", "")).join("") || '<div class="gbos">Bu ilde standart verisi yok.</div>'; });
      }).join("");
      const cok = jobs.filter(j => j.il.length > 1);
      govde += `<div class="ayrac"></div>` + satir("cok", "Birden Fazla İl", cok, () => cok.map(j => `<button class="gi" data-is="${esc(j.id)}"><b>${esc(j.ad)}</b><small>${esc(j.il.join(" · "))}</small></button>`).join("") || '<div class="gbos">Birden fazla ilde iş yok.</div>');
    }
  }
  const IA = IKON_IS.replace(/#ea580c/g, "#fb923c"), HA = IKON_HEDEF.replace(/#16a34a/g, "#4ade80");
  if(gdSekme === "il") govde = `<div class="ilbas"><div><span>${IKON_IS}İş</span><span>${IKON_HEDEF}Fiz.</span></div></div>` + govde;
  return `<div class="gd" id="gd"><div class="gdh2"><div class="t"><b>Genel Durum</b><span>${D.yil}</span></div>
<div class="n"><div><i class="ik">${IA}</i><span><b>${ISLER.length}</b><small>Toplam İş</small></span></div><div><i class="ik">${HA}</i><span><b>${ISLER.filter(j => j.fh).length}</b><small>Fiziksel Hedefli</small></span></div></div></div>
<div class="seg"><button data-gdsekme="std"${gdSekme === "std" ? ' class="on"' : ""}>Standartlar</button><button data-gdsekme="il"${gdSekme === "il" ? ' class="on"' : ""}>İl Bazlı</button></div><div class="gdg" id="gdg">${govde}</div></div>`;
}
function gdYenile(korunsun){ const g = document.getElementById("gd"); if(!g) return; const y = korunsun ? (document.getElementById("gdg")?.scrollTop || 0) : 0; g.outerHTML = genelDurum(); const n = document.getElementById("gdg"); if(n) n.scrollTop = y; }

// ---------- Anasayfa ----------
// Her standart için ayrı satır + harita kartındaki gibi kırmızı/mavi çizgi
function stdSatirlari(j){
  return j.cats.map(c => { const p = yuzde(c.b, c.h); return `<div class="sr"><div class="st"><span><b>${esc(c.ad)}</b>${f2(c.b)} / ${f2(c.h)} km</span><i>%${p}</i></div><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join("");
}
function isSatir(j){
  return `<div class="jr" data-is="${esc(j.id)}"><div class="t"><b>${esc(j.ad)}</b></div>
<div class="m">${esc([j.il.join(" · "), j.firma].filter(Boolean).join(" · "))}</div>${stdSatirlari(j)}</div>`;
}
let aramaAcik = false;
function aramaSonuc(){
  const q = fold(isAra);
  return ISLER.filter(j => !q || fold([j.ad, j.firma, j.sef, j.il.join(" ")].join(" ")).includes(q));
}
function isListesi(list){
  return list.length ? list.map(isSatir).join("") : '<div class="empty">Aramaya uyan iş yok.</div>';
}
const aramaBaslik = n => `${isAra.trim() ? "Arama sonuçları" : "Tüm işler"} · ${n} iş`;
// Anasayfa: normalde yalnızca Genel Durum; 🔍 ile bütün işler listelenir,
// yazdıkça süzülür, ✕ ile Genel Durum'a dönülür.
function anasayfa(){
  const list = aramaAcik ? aramaSonuc() : [];
  return `<div class="hdr"><div><div class="u">Strateji Geliştirme Başmühendisliği</div><div class="k"><b>KGM</b>7. Bölge Müdürlüğü</div><div class="vt">Veri: ${veriTarih()}</div></div>
<div class="hbtn"><button class="ikb${aramaAcik ? " on" : ""}" data-arama aria-label="${aramaAcik ? "Aramayı kapat" : "İş ara"}">${aramaAcik ? "✕" : "🔍"}</button><button class="yukle" data-yukle>📂 Veri Yükle</button></div></div>
<div class="pad">${eskiUyari()}
${aramaAcik ? `<input class="search" id="isAra" type="search" placeholder="🔍 İş, firma, şef ya da il ara…" value="${esc(isAra)}" autocomplete="off">
<div class="sec" id="isSay">${aramaBaslik(list.length)}</div>
<div id="isListe" style="display:flex;flex-direction:column;gap:10px">${isListesi(list)}</div>` : genelDurum()}
</div>`;
}

// ---------- İş bilgileri (detay) ----------
function detaySayfa(j, from){
  const par = j.par;
  const cokStd = j.cats.length > 1;
  // İş Bilgileri kartında yalnızca tarihler; bedeller "Parasal" düğmesiyle açılır
  const uz = j.uz || [];
  const uzBlok = (label, fn) => `<div class="kv uz"><span>${label}</span><b>${uz.map(r => `<span><em>${esc(r.s)}</em> ${fn(r)}</span>`).join("")}</b></div>`;
  const kalan = r => r.u === null || r.u === undefined ? "–" : f2(Math.max(0, r.u - (r.o || 0) - (r.y || 0))) + " km";
  const parHtml = (par.it || par.st || uz.length) ? `<div class="card"><div class="ct">İş Bilgileri</div>
<div class="kv"><span>İhale Tarihi</span><b>${tarih(par.it) || "–"}</b></div><div class="kv"><span>Sözleşme Tarihi</span><b>${tarih(par.st) || "–"}</b></div>
${uz.length ? uzBlok("İhale Uzunluğu", r => r.u === null || r.u === undefined ? "–" : f2(r.u) + " km") + uzBlok(`${D.yil} Öncesi Yapılan`, r => f2(r.o) + " km") + uzBlok(`${yilEki(D.yil)} Yapılan`, r => f2(r.y) + " km") + uzBlok("Kalan", kalan) : ""}</div>` : "";
  const yb = (k, ad) => `<button class="dbtn${(j[k] || "").trim() ? "" : " bos"}" data-yazi="${k}">${D.yil} ${ad}</button>`;
  const haritadaGoster = from !== "map" && j.kutular.length;
  return `<div class="dh"><button class="back" data-geri>‹ ${GERI_AD[from]}</button><h2>${esc(j.ad)}</h2><div class="mt">${esc([j.il.join(" · "), std(j), j.kk ? "K.K.No " + j.kk : ""].filter(Boolean).join(" · "))}</div></div>
<div class="pad">
${j.cats.length ? `<div class="card">${j.cats.map(c => { const p = yuzde(c.b, c.h); return `<div class="stdk"><div class="ad">${esc(c.ad)}</div><div class="hb">Hedef: ${f2(c.h)} KM<br>Biten: ${f2(c.b)} KM</div><div class="pbar"><i style="width:${p}%">${p}%</i></div></div>`; }).join("")}</div>` : ""}
<div class="card"><div class="kv"><span>Yüklenici</span><b>${esc(j.firma) || "–"}</b></div><div class="kv"><span>Kontrol Şefi</span><b>${esc(j.sef) || "–"}</b></div></div>
${j.kmler.length ? `<div class="card"><div class="ct">KM Aralıkları</div>${j.kmler.map((k, i) => `<div class="rng"><b>${cokStd ? esc(k.s) + " · " : ""}${esc(k.a)} – ${esc(k.e)}${k.y ? " (yarısı)" : ""}</b><span>${(k.ac || "").trim() ? `<button class="acb" data-ac="${i}">Açıklama</button>` : ""}${tarih(k.t)}</span></div>`).join("")}</div>` : ""}
${parHtml}
<div class="btns">${yb("devam", "Devam Eden")}${yb("biten", "Biten")}</div>
${parVar(j) || itiVar(j) ? `<div class="btns">${parVar(j) ? `<button class="btn alt" data-parasal="${esc(j.id)}">₺ Parasal</button>` : ""}${itiVar(j) ? `<button class="btn iti" data-iti="${esc(j.id)}">İtinerer</button>` : ""}</div>` : ""}
<div class="btns">${haritadaGoster ? `<button class="btn" data-haritada="${esc(j.id)}">🗺 Haritada Göster</button>` : ""}${kmzBtn(j, "")}</div>
</div>`;
}

// "2026'da", "2027'de", "2033'te"
function yilEki(y){
  const n = Number(y) % 100, b = n % 10, o = Math.floor(n / 10);
  const birler = ["", "de", "de", "te", "te", "te", "da", "de", "de", "da"];
  const onlar = ["da", "da", "de", "da", "ta", "de", "ta", "te", "de", "da"];
  return `${y}'${b ? birler[b] : o ? onlar[o] : "de"}`;
}

// Parasal küçük penceresi: İhale Bedeli, Proje Bedeli (çok illi işte il il),
// altında Excel'den seçilen sütunlar (Excel'deki sırasıyla). Oran yok.
const parVar = j => j.par.ib !== null || j.par.pb !== null || (j.ek && j.ek.length);
function parasalPenceresi(j){
  const par = j.par;
  const tl = n => n !== null && n !== undefined ? f2(n) + " ₺" : "–";
  let html = `<div class="kv"><span>İhale Bedeli</span><b class="g">${tl(par.ib)}</b></div>
<div class="kv"><span>Proje Bedeli</span><b class="g">${tl(par.pb)}</b></div>`;
  if(par.iller && j.il.length > 1) html += `<div class="ils" style="margin:6px 0 4px">${Object.keys(par.iller).map(il => { const x = par.iller[il] || {}; return `<div class="il" style="padding:3px 0 0"><span class="ad">${esc(il)}</span><span>İhale ${tl(x.ihaleTutari)}</span></div><div class="il" style="padding:0 0 3px"><span></span><span>Proje ${tl(x.projeBedeli)}</span></div>`; }).join("")}</div>`;
  if(j.ek && j.ek.length) html += `<div class="ekler">${j.ek.map(([b, v]) => `<div class="kv"><span>${esc(b)}</span><b>${esc(v)}</b></div>`).join("")}</div>`;
  pencere("Parasal", j.ad, html, false, true);
}

// Devam Eden / Biten küçük penceresi
function yaziPenceresi(j, k){
  pencere(`${D.yil} ${k === "devam" ? "Devam Eden" : "Biten"}`, j.ad, (j[k] || "").trim(), true);
}
// KM aralığının açıklaması (yalnızca okunur)
function aciklamaPenceresi(j, i){
  const k = j.kmler[i]; if(!k) return;
  pencere(`${j.cats.length > 1 ? k.s + " · " : ""}${k.a} – ${k.e}${k.y ? " (yarısı)" : ""}`, [tarih(k.t), j.ad].filter(Boolean).join(" · "), (k.ac || "").trim(), false);
}
function pencere(ad, alt, metin, kopyalanir, html){
  kapatPop();
  const ov = document.createElement("div"); ov.className = "ov"; ov.id = "pop";
  ov.innerHTML = `<div class="pop"><div class="ph"><div><b>${esc(ad)}</b><small>${esc(alt)}</small></div><button class="x" data-popkapat aria-label="Kapat">✕</button></div>
${html ? `<div class="pkv">${metin}</div>` : `<div class="tx">${metin ? esc(metin) : '<span class="muted">Bu yıl için yazı girilmemiş.</span>'}</div>`}
${metin && kopyalanir ? `<button class="btn" data-kopyala>Kopyala</button>` : ""}</div>`;
  ov.addEventListener("click", async e => {
    if(e.target === ov || e.target.closest("[data-popkapat]")){ kapatPop(); return; }
    if(e.target.closest("[data-kopyala]")){
      const ok = await kopyala(metin);
      kapatPop();
      bildir(ok ? "Kopyalandı" : "Kopyalanamadı — yazıya basılı tutup seçin");
    }
  });
  document.body.appendChild(ov);
}
function kapatPop(){ document.getElementById("pop")?.remove(); }
async function kopyala(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);

function harita(){

function mapUygula(){
  const inn = document.getElementById("mapin"), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!inn || !w || !img) return;
  const W = w.clientWidth, H = w.clientHeight;
  inn.style.width = W + "px";
  const iw = W * mz.s, ih = img.offsetHeight * mz.s;
  mz.x = Math.min(0, Math.max(W - iw, mz.x));
  mz.y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, mz.y));
  inn.style.transform = `translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const bw = (2 / mz.s) + "px";
  inn.querySelectorAll(".kutu").forEach(k => { k.style.borderWidth = bw; });
}
function mapZoom(f, cx, cy){
  const w = document.getElementById("mapwrap"); if(!w) return;
  const ns = Math.min(10, Math.max(1, mz.s * f));
  cx = cx ?? w.clientWidth / 2; cy = cy ?? w.clientHeight / 2;
  mz.x = cx - (cx - mz.x) * ns / mz.s; mz.y = cy - (cy - mz.y) * ns / mz.s; mz.s = ns;
  mapUygula();
}
function resimHazir(f){
  const img = document.getElementById("mapimg"); if(!img) return;
  if(img.complete && img.naturalWidth) f(); else img.addEventListener("load", f, { once: true });
}
function mapKur(){
  const w = document.getElementById("mapwrap"); if(!w) return;
  resimHazir(mapUygula);
  let t0 = null, d0 = 0, s0 = 1, m0 = null, last = 0;
  w.addEventListener("touchstart", e => {
    if(e.target.closest(".sheet, .zoom")) return;
    if(e.touches.length === 2){ const [a, b] = e.touches; d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); s0 = mz.s; m0 = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; t0 = null; }
    else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y };
      const now = Date.now(); if(now - last < 300){ const r = w.getBoundingClientRect(); mapZoom(2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } last = now; }
  }, { passive: true });
  w.addEventListener("touchmove", e => {
    if(e.target.closest(".sheet")) return;
    e.preventDefault();
    const r = w.getBoundingClientRect();
    if(e.touches.length === 2 && d0){ const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); mapZoom((s0 * d / d0) / mz.s, m0.x - r.left, m0.y - r.top); }
    else if(e.touches.length === 1 && t0){ mz.x = e.touches[0].clientX - t0.x; mz.y = e.touches[0].clientY - t0.y; mapUygula(); }
  }, { passive: false });
  w.addEventListener("touchend", e => { if(e.touches.length === 0){ d0 = 0; t0 = null; } else if(e.touches.length === 1){ t0 = { x: e.touches[0].clientX - mz.x, y: e.touches[0].clientY - mz.y }; d0 = 0; } });
  // fare (bilgisayarda açılırsa)
  let md = null, surukle = false;
  w.addEventListener("mousedown", e => { if(e.target.closest(".sheet, .zoom")) return; md = { x: e.clientX - mz.x, y: e.clientY - mz.y, ox: e.clientX, oy: e.clientY }; surukle = false; });
  window.onmousemove = e => { if(md){ if(Math.abs(e.clientX - md.ox) + Math.abs(e.clientY - md.oy) > 4) surukle = true; mz.x = e.clientX - md.x; mz.y = e.clientY - md.y; mapUygula(); } };
  window.onmouseup = () => { md = null; setTimeout(() => { surukle = false; }, 0); };
  w.addEventListener("click", e => { if(surukle){ e.stopPropagation(); e.preventDefault(); } }, true);
  w.addEventListener("wheel", e => { e.preventDefault(); const r = w.getBoundingClientRect(); mapZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}
function kutuyaGit(id){
  const j = byId(id), w = document.getElementById("mapwrap"), img = document.getElementById("mapimg");
  if(!j || !j.kutular.length || !w) return;
  resimHazir(() => {
    const k = j.kutular[0], W = w.clientWidth, H = w.clientHeight, ih = img.offsetHeight;
    // kutu ekranın yaklaşık üçte birini kaplasın
    mz.s = Math.min(10, Math.max(1.5, Math.min(W * 0.35 / (k[2] / 100 * W), H * 0.3 / (k[3] / 100 * ih))));
    const cx = (k[0] + k[2] / 2) / 100 * W, cy = (k[1] + k[3] / 2) / 100 * ih;
    mz.x = W / 2 - cx * mz.s; mz.y = H * 0.38 - cy * mz.s;
    mapUygula();
  });
}

// ---------- Mevcut konum (yalnızca ekranda gösterilir, hiçbir yere gönderilmez) ----------
let konumIzle = null;
function konumBaslat(j, m, sinir){
  const v = document.getElementById("hatv");
  let isaret = null, halka = null, son = null;
  v.querySelector("[data-yola]").addEventListener("click", () => { if(sinir.length) m.fitBounds(sinir, { padding: [30, 30], maxZoom: 16 }); });
  v.querySelector("[data-konumum]").addEventListener("click", () => {
    if(son) m.setView(son, Math.max(m.getZoom(), 16));
    else kart("Konum bekleniyor…", "Telefonun konum izni açık olmalı");
  });
  const kart = (b, s) => { const k = document.getElementById("konumkart"); if(!k) return; k.style.display = ""; document.getElementById("konumb").textContent = b; document.getElementById("konums").textContent = s || ""; };
  if(!navigator.geolocation){ return; }
  konumIzle = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy || 0;
    son = ll;
    if(!isaret){
      halka = L.circle(ll, { radius: acc, color: "#60a5fa", weight: 1, fillColor: "#3b82f6", fillOpacity: 0.15, interactive: false }).addTo(m);
      isaret = L.circleMarker(ll, { radius: 8, color: "#ffffff", weight: 3, fillColor: "#2563eb", fillOpacity: 1, interactive: false }).addTo(m);
      v.querySelector("[data-konumum]").classList.add("on");
    }else{ isaret.setLatLng(ll); halka.setLatLng(ll).setRadius(acc); }
    const r = kmBul(j, ll[0], ll[1]);
    if(!r) kart("Konumunuz gösteriliyor", "");
    else if(r.d <= 1000) kart(r.km !== null ? `Yaklaşık ${kmYaz(r.km)} civarındasınız` : "Yol hattının yakınındasınız", `Yol hattına ~${mesafe(r.d)}`);
    else kart(`Yol hattına ${mesafe(r.d)} uzaktasınız`, r.km !== null ? `En yakın yer: yaklaşık ${kmYaz(r.km)}` : "");
  }, err => {
    kart(err.code === 1 ? "Konum izni verilmedi" : "Konum alınamadı", err.code === 1 ? "Ayarlar → Safari/Chrome → Konum'dan izin verebilirsiniz" : "");
    setTimeout(() => { const k = document.getElementById("konumkart"); if(k && !son) k.style.display = "none"; }, 5000);
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function konumDurdur(){ if(konumIzle !== null && navigator.geolocation){ navigator.geolocation.clearWatch(konumIzle); } konumIzle = null; }
const kmYaz = km => { const mt = Math.round(km * 1000 / 10) * 10; return `${Math.floor(mt / 1000)}+${String(mt % 1000).padStart(3, "0")}`; };
const mesafe = d => d < 1000 ? `${Math.round(d / 10) * 10} m` : `${(d / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 1 })} km`;
// En yakın KM: adında "12+000" gibi KM geçen noktalar sıralanır, konum
// ardışık iki KM noktası arasındaki parçaya izdüşürülüp aradaki değer bulunur.
function kmBul(j, lat, lon){
  const k = Math.cos(lat * Math.PI / 180), M = 111320;
  const xy = (a, b) => [(b - lon) * k * M, (a - lat) * M];
  const parca = (A, B) => { const dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy; let t = L2 ? -(A[0] * dx + A[1] * dy) / L2 : 0; t = Math.max(0, Math.min(1, t)); const x = A[0] + t * dx, y = A[1] + t * dy; return { d: Math.hypot(x, y), t }; };
  let d = Infinity;
  j.hat.cizgi.forEach(c => { for(let i = 1; i < c.p.length; i++){ d = Math.min(d, parca(xy(c.p[i - 1][0], c.p[i - 1][1]), xy(c.p[i][0], c.p[i][1])).d); } });
  const kms = [];
  j.hat.nok.forEach(n => { const x = /(\d+)\s*\+\s*(\d{3})/.exec(n[2] || ""); if(x) kms.push({ km: +x[1] + +x[2] / 1000, p: xy(n[0], n[1]) }); });
  kms.sort((a, b) => a.km - b.km);
  let en = null;
  for(let i = 1; i < kms.length; i++){
    const a = kms[i - 1], b = kms[i];
    if(b.km - a.km <= 0 || b.km - a.km > 2) continue;
    const r = parca(a.p, b.p);
    if(!en || r.d < en.d) en = { d: r.d, km: a.km + r.t * (b.km - a.km) };
  }
  if(!en && kms.length){ kms.forEach(x => { const dd = Math.hypot(x.p[0], x.p[1]); if(!en || dd < en.d) en = { d: dd, km: x.km }; }); }
  if(!isFinite(d) && !en) return null;
  return { d: isFinite(d) ? d : en.d, km: en ? en.km : null };
}
function hatKapat(){
  konumDurdur();
  if(hatHarita){ hatHarita.remove(); hatHarita = null; }
  document.getElementById("hatv")?.remove();
}

// Çizim ekranın yüksekliğine oturur (z: yakınlaştırma), yatayda kaydırılır
function itiBoyut(){
  const a = document.getElementById("itialan"), host = document.getElementById("itihost");
  if(!a || !host || !host.shadowRoot) return;
  const sr = host.shadowRoot, kap = sr.querySelector(".kap");
  const svgs = [...sr.querySelectorAll("svg")].filter(x => !x.parentElement.closest("svg") && x.viewBox && x.viewBox.baseVal && x.viewBox.baseVal.width);

function itiZoom(f, mx, my){

  const ox = (a.scrollLeft + mx) / Math.max(1, a.scrollWidth), oy = (a.scrollTop + my) / Math.max(1, a.scrollHeight);

function itiDokunma(a){

    else if(e.touches.length === 1){ const t = Date.now(); if(t - son < 300){ const r = a.getBoundingClientRect(); itiZoom(itiDurum.z > 1.5 ? 1 / itiDurum.z : 2, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); } son = t; }
  }, { passive: true });

    itiZoom((z0 * d / d0) / itiDurum.z, (p.clientX + q.clientX) / 2 - r.left, (p.clientY + q.clientY) / 2 - r.top);
  }, { passive: false });
  a.addEventListener("touchend", e => { if(e.touches.length < 2) d0 = 0; });

// ---------- Veri yükleme / saklama ----------
// Veri yalnızca bu telefonda (IndexedDB) saklanır; hiçbir yere gönderilmez.
const DB_AD = "istakip-mobil", DEPO = "veri";
function idb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(DB_AD, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DEPO);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
async function veriOku(){
  try{
    const db = await idb();
    return await new Promise(ok => { const t = db.transaction(DEPO).objectStore(DEPO).get("son"); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); });
  }catch(e){ try{ return JSON.parse(localStorage.getItem("istakip-mobil-veri") || "null"); }catch(_){ return null; } }
}
async function veriYaz(v){
  try{
    const db = await idb();
    await new Promise((ok, no) => { const t = db.transaction(DEPO, "readwrite"); t.objectStore(DEPO).put(v, "son"); t.oncomplete = ok; t.onerror = () => no(t.error); });
  }catch(e){ localStorage.setItem("istakip-mobil-veri", JSON.stringify(v)); }
}
// Eski (1. sürüm) dosyalar da açılsın
function duzelt(v){
  (v.isler || []).forEach(j => {
    j.il = j.il || []; j.cats = j.cats || []; j.kmler = j.kmler || [];
    j.par = j.par || { it: "", st: "", ib: null, pb: null, iller: null };
    j.uz = Array.isArray(j.uz) ? j.uz : []; j.ek = Array.isArray(j.ek) ? j.ek : []; j.iti = Array.isArray(j.iti) ? j.iti : [];
    if(!Array.isArray(j.kutular)) j.kutular = j.pin ? [[j.pin[0] - 1.5, j.pin[1] - 1.5, 3, 3]] : [];
    if(Array.isArray(j.hat)) j.hat = { cizgi: j.hat.map(p => ({ r: "#dc2626", i: 0, p })), nok: [] };
    if(j.hat && !(j.hat.cizgi.length || j.hat.nok.length)) j.hat = null;
  });
  return v;
}
function kur(v){
  D = duzelt(v); ISLER = D.isler || [];
  tab = "home"; detay = null; isAra = ""; aramaAcik = false; parAra = ""; secKutu = null; mz = { s: 1, x: 0, y: 0 };
}

function dosyaSec(){
  let inp = document.getElementById("dosya-sec");
  if(!inp){
    inp = document.createElement("input");
    inp.type = "file"; inp.id = "dosya-sec"; inp.style.display = "none";
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0];
      inp.value = "";
      if(!f) return;
      try{
        const o = JSON.parse(await f.text());
        const v = o && o.format === "istakip-mobil" ? o.veri : o;
        if(!v || !Array.isArray(v.isler) || !v.olusturma) throw new Error("bicim");
        const eski = D && D.olusturma > v.olusturma;
        await veriYaz(v);
        kur(v);
        document.getElementById("tabs").style.display = "";
        ciz(); ust();
        bildir(eski ? "Dikkat: yüklenen dosya öncekinden daha eski (" + veriTarih() + ")" : "Veri yüklendi: " + veriTarih());
      }catch(e){
        if(D) bildir("Bu dosya İşTakip veri dosyası değil.");
        else hosgeldin("Bu dosya İşTakip veri dosyası değil. WhatsApp'taki .istakip dosyasını seçin.");
      }
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function bildir(m){
  document.querySelectorAll(".bildir").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "bildir"; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
document.addEventListener("click", e => { if(e.target.closest("[data-yukle]")){ e.preventDefault(); e.stopImmediatePropagation(); dosyaSec(); } }, true);
(async () => {
  const v = await veriOku();
  if(v){ kur(v); ciz(); }
  else hosgeldin();
})();
